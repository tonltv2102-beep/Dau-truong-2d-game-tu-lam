<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kiếm Sĩ Lang Thang</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d16}
body{font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#hud{position:fixed;top:12px;left:12px;z-index:3;color:white;width:min(230px,48vw);pointer-events:none}
.hudname{font-size:12px;letter-spacing:2px;color:#dce9ff;margin-bottom:6px;text-shadow:0 2px 4px #000}
.bar{height:11px;background:#171c29;border:1px solid #69758a;margin-bottom:5px;transform:skewX(-12deg);overflow:hidden}
.fill{height:100%;width:100%;transition:width .15s}
#hp{background:linear-gradient(90deg,#a82035,#ff6470)}
#xp{background:linear-gradient(90deg,#2674c9,#6dd9ff)}
#bossHud{display:none;position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(310px,55vw);z-index:3;color:#fff;text-align:center;pointer-events:none}
#bossHud .bar{height:9px}
#bossHp{background:linear-gradient(90deg,#831a28,#ff4654)}
#info{position:fixed;top:76px;left:12px;color:#d7e3f8;font-size:11px;text-shadow:0 2px 4px #000;z-index:3;pointer-events:none}
#controls{position:fixed;inset:0;z-index:5;pointer-events:none}
.pad{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:10px;align-items:flex-end}
#movePad{left:18px}
#actionPad{right:18px;gap:12px}
.ctrl{pointer-events:auto;width:58px;height:58px;border-radius:50%;border:1.5px solid rgba(235,245,255,.36);background:rgba(12,20,34,.08);color:#f3f7ff;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);touch-action:none;user-select:none;box-shadow:0 2px 12px #0002}
.ctrl:active,.ctrl.down{background:rgba(180,210,255,.16);border-color:rgba(255,255,255,.8)}
.ctrl svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#attack{width:76px;height:76px;border-color:rgba(255,255,255,.48)}
#attack svg{width:48px;height:48px;transform:rotate(-24deg)}
.small{width:49px;height:49px}
#startScreen{position:fixed;inset:0;z-index:10;background:linear-gradient(#080d18c9,#080d18ed),radial-gradient(ellipse at center,#243955,#080d18);display:flex;align-items:center;justify-content:center;color:white;text-align:center;padding:20px}
.panel{max-width:430px;width:100%;padding:28px 22px;border:1px solid #8398b455;background:#101a2bd9;box-shadow:0 15px 60px #0009}
.panel h1{font-size:clamp(25px,6vw,42px);letter-spacing:3px;margin:0 0 8px;color:#e8f2ff;text-shadow:0 0 22px #75aaff66}
.panel p{font-size:13px;line-height:1.7;color:#b9c9df}
#startBtn{margin-top:14px;padding:14px 35px;border:1px solid #a9c9f5;background:linear-gradient(135deg,#304e75,#172b49);color:white;font-weight:bold;letter-spacing:2px;font-size:14px}
#hint{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);color:#d7e3f899;font-size:10px;z-index:2;pointer-events:none;white-space:nowrap}
@media (orientation:landscape){
 #hud{top:10px;left:14px}
 .pad{bottom:14px}
 #movePad{left:22px}
 #actionPad{right:22px}
 .ctrl{width:55px;height:55px}
 #attack{width:72px;height:72px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
 <div class="hudname">WANDERER · KIẾM SĨ</div>
 <div class="bar"><div class="fill" id="hp"></div></div>
 <div class="bar" style="height:5px"><div class="fill" id="xp"></div></div>
 <div style="font-size:10px;color:#dbe8fa;text-shadow:0 1px 4px #000" id="stats">HP 100 / 100</div>
</div>
<div id="bossHud">
 <div style="font-size:11px;letter-spacing:3px;margin-bottom:5px">KẺ CANH GIỮ DI TÍCH</div>
 <div class="bar"><div class="fill" id="bossHp"></div></div>
</div>
<div id="info">KHU RỪNG CỔ · VÙNG 01</div>

<div id="controls">
 <div class="pad" id="movePad">
  <button class="ctrl" id="left" aria-label="Sang trái"><svg viewBox="0 0 24 24"><path d="M15 5 7 12l8 7"/></svg></button>
  <button class="ctrl" id="right" aria-label="Sang phải"><svg viewBox="0 0 24 24"><path d="m9 5 8 7-8 7"/></svg></button>
 </div>
 <div class="pad" id="actionPad">
  <button class="ctrl small" id="jump" aria-label="Nhảy"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  <button class="ctrl small" id="dash" aria-label="Lướt"><svg viewBox="0 0 24 24"><path d="m4 8 5 4-5 4M12 8l5 4-5 4"/></svg></button>
  <button class="ctrl" id="skill" aria-label="Kỹ năng"><svg viewBox="0 0 24 24"><path d="M4 18 18 4M8 4h10v10M4 7l3-3M17 20l3-3"/></svg></button>
  <button class="ctrl" id="attack" aria-label="Chém"><svg viewBox="0 0 64 64"><path d="M12 49 43 9l8-4-2 9-31 39z" fill="rgba(220,237,255,.18)"/><path d="M12 49 43 9l8-4-2 9-31 39z"/><path d="m8 44 12 9M5 51l8 8M17 53l-5 6"/></svg></button>
 </div>
</div>
<div id="hint">◀ ▶ DI CHUYỂN · ↑ NHẢY · KIẾM TẤN CÔNG</div>

<div id="startScreen">
 <div class="panel">
  <h1>KIẾM SĨ<br>LANG THANG</h1>
  <p>Một hành trình bắt đầu giữa khu rừng cổ.<br>Khám phá, gặp gỡ nhân vật và đối đầu với kẻ canh giữ.</p>
  <p style="color:#91a9c9">Di chuyển: ◀ ▶ &nbsp; Nhảy: ↑ &nbsp; Tấn công: Kiếm</p>
  <button id="startBtn">BẮT ĐẦU PHIÊU LƯU</button>
 </div>
</div>

<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,D=1;
function resize(){
 W=visualViewport?.width||innerWidth;
 H=visualViewport?.height||innerHeight;
 D=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);
 canvas.style.width=W+"px";canvas.style.height=H+"px";
 ctx.setTransform(D,0,0,D,0,0);
}
addEventListener("resize",resize);
addEventListener("orientationchange",()=>setTimeout(resize,120));
visualViewport?.addEventListener("resize",resize);
resize();

const world={width:3400,ground:0};
let camera=0,playing=false,last=0,time=0,shake=0;
const keys={left:false,right:false};
const hero={x:150,y:0,vx:0,vy:0,w:34,h:62,face:1,hp:100,max:100,
 onGround:false,attack:0,attackCd:0,inv:0,dash:0,dashCd:0,
 skill:0,skillCd:0,anim:0,xp:0};
let enemies=[],particles=[],floating=[],npc={x:600,y:0},boss={
 x:2650,y:0,hp:200,max:200,active:false,rage:0,dead:false,attack:0
};
const floor=()=>H*.78;
function reset(){
 hero.x=150;hero.y=floor()-hero.h;hero.vx=0;hero.vy=0;hero.hp=100;
 hero.attack=0;hero.attackCd=0;hero.inv=0;hero.dash=0;hero.dashCd=0;
 hero.skill=0;hero.skillCd=0;hero.xp=0;
 enemies=[
  makeEnemy(900),makeEnemy(1250),makeEnemy(1700),makeEnemy(2100)
 ];
 particles=[];floating=[];boss.hp=200;boss.dead=false;boss.active=false;boss.rage=0;
}
function makeEnemy(x){return{x,y:0,hp:55,max:55,dir:-1,attack:0,hit:0,anim:0}}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function line(x1,y1,x2,y2,c,w=1){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function text(t,x,y,size,color){ctx.font=`${size}px Arial`;ctx.fillStyle=color;ctx.fillText(t,x,y)}
function particle(x,y,color,n=8,power=3){
 for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=Math.random()*power+1;
 particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:25+Math.random()*20,max:45,color,size:2+Math.random()*3})}
}
function floatText(t,x,y,color="#fff"){floating.push({t,x,y,life:48,color})}

function drawBackground(){
 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#111d32");g.addColorStop(.58,"#30465a");g.addColorStop(1,"#182331");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // moon
 circle(W*.78,H*.19,35,"#d4dfdf22");circle(W*.78,H*.19,25,"#d4dfdf18");
 // distant mountains
 for(let i=0;i<8;i++){
  let x=((i*330-camera*.18)%(W+400)+W+400)%(W+400)-150;
  ctx.fillStyle=i%2?"#1c2d40":"#24384b";
  ctx.beginPath();ctx.moveTo(x,floor()-45);ctx.lineTo(x+145,floor()-220-(i%3)*28);ctx.lineTo(x+310,floor()-45);ctx.fill();
 }
 // distant trees
 for(let i=0;i<20;i++){
  let x=((i*190-camera*.36)%(W+220)+W+220)%(W+220)-100;
  let y=floor()-20;
  rect(x+22,y-125,13,125,"#182c2b");
  for(let j=0;j<4;j++){
   ctx.fillStyle=["#1b3934","#23483b","#1a332f"][j%3];
   ctx.beginPath();ctx.moveTo(x-12+j*8,y-90-j*22);ctx.lineTo(x+29,y-160-j*20);ctx.lineTo(x+72-j*8,y-90-j*22);ctx.fill();
  }
 }
 // ground
 let gr=ctx.createLinearGradient(0,floor(),0,H);
 gr.addColorStop(0,"#34483d");gr.addColorStop(.12,"#202f2d");gr.addColorStop(1,"#111b22");
 ctx.fillStyle=gr;ctx.fillRect(0,floor(),W,H-floor());
 rect(0,floor(),W,5,"#71836b");
 for(let i=0;i<50;i++){
  let x=((i*83-camera)%(W+100)+W+100)%(W+100)-40;
  rect(x,floor()+14+(i%5)*9,18+(i%4)*7,2,"#425148");
  rect(x+12,floor()+35+(i%4)*13,3,2,"#68715b");
 }
 // foreground broken pillars
 for(let i=0;i<6;i++){
  let x=((i*710-camera*.8)%(W+250)+W+250)%(W+250)-100;
  if(i%2===0){
   rect(x,floor()-72,24,72,"#35464a");rect(x-4,floor()-77,32,8,"#68746d");
   rect(x+5,floor()-62,4,50,"#52615c");
  }
 }
}

function drawHero(){
 let x=hero.x-camera,y=hero.y;
 ctx.save();
 if(hero.face<0){ctx.translate(x+hero.w,y);ctx.scale(-1,1);x=0;y=0}else{ctx.translate(x,y);x=0;y=0}
 let run=Math.abs(hero.vx)>20&&hero.onGround;
 let step=run?Math.sin(hero.anim*0.22)*5:0;
 // shadow
 ctx.globalAlpha=.28;ctx.fillStyle="#000";ctx.beginPath();ctx.ellipse(17,hero.h+2,22,5,0,0,7);ctx.fill();ctx.globalAlpha=1;
 // legs + boots
 rect(8,43,9,14,"#202c3c");rect(19,43,9,14,"#202c3c");
 rect(6+step,54,13,7,"#111a27");rect(19-step,54,14,7,"#111a27");
 rect(7+step,54,10,2,"#8d9ba7");rect(20-step,54,10,2,"#8d9ba7");
 // back cloak
 ctx.fillStyle="#7a2634";ctx.beginPath();ctx.moveTo(9,14);ctx.lineTo(1,27);ctx.lineTo(4-step,49);ctx.lineTo(17,43);ctx.lineTo(22,19);ctx.fill();
 rect(5,23,7,18,"#a13d48");rect(5,41,9,3,"#532632");
 // torso armor
 rect(8,16,20,27,"#26394d");rect(10,17,16,22,"#536b7d");
 rect(10,20,5,16,"#a5b4bc");rect(17,20,7,15,"#718b9b");
 rect(13,18,7,5,"#d4dce0");rect(14,25,5,3,"#263a50");
 // belt
 rect(8,38,20,5,"#4b3028");rect(16,38,5,5,"#d1ad65");
 // shoulder armor
 rect(5,16,9,8,"#7c8e9a");rect(5,16,9,3,"#c1cbd0");
 rect(23,17,9,8,"#7c8e9a");rect(23,17,9,3,"#c1cbd0");
 // arm
 rect(25,24,7,14,"#bd9a83");rect(25,26,8,8,"#354d63");
 // neck + head
 rect(14,10,9,8,"#b98772");
 rect(10,0,19,15,"#c99b80");
 rect(9,2,20,6,"#26313e");
 rect(8,0,21,5,"#293b50");
 rect(9,-2,16,5,"#3f566b");
 rect(12,7,3,2,"#222b38");rect(23,7,3,2,"#222b38");
 rect(20,11,6,2,"#8c5c51");
 // hair locks
 rect(8,2,5,9,"#202b39");rect(12,0,5,4,"#35495c");
 rect(24,1,6,8,"#202b39");
 // scarf
 rect(9,14,17,4,"#a53e4a");rect(22,14,8,3,"#d35b5b");
 // sword in idle / slash
 ctx.save();
 if(hero.attack>0){
  let p=1-hero.attack/16;
  ctx.translate(24,31);ctx.rotate(-1.55+p*1.65);
  drawSword(0,0);
  ctx.restore();
  ctx.save();ctx.globalAlpha=Math.min(1,hero.attack/5)*.65;
  ctx.strokeStyle="#e6f5ff";ctx.lineWidth=4;ctx.beginPath();
  ctx.arc(23,29,47,-1.7,-.1);ctx.stroke();
  ctx.strokeStyle="#86c9ff";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(23,29,51,-1.7,-.1);ctx.stroke();
  ctx.restore();
 }else{
  ctx.translate(27,32);ctx.rotate(.45);drawSword(0,0);ctx.restore();
 }
 ctx.restore();
}
function drawSword(x,y){
 // sword handle, guard, blade
 rect(x-2,y+2,6,15,"#49372e");
 rect(x-3,y+3,8,3,"#c39a63");
 rect(x-5,y+15,12,4,"#c3a06a");
 rect(x-2,y+18,6,4,"#e0c18a");
 // blade silhouette
 ctx.fillStyle="#667e91";ctx.beginPath();
 ctx.moveTo(x-2,y+15);ctx.lineTo(x+2,y-35);ctx.lineTo(x+7,y-44);ctx.lineTo(x+7,y-32);ctx.lineTo(x+4,y+15);ctx.closePath();ctx.fill();
 ctx.fillStyle="#e5f3fa";ctx.beginPath();
 ctx.moveTo(x+1,y+13);ctx.lineTo(x+4,y-34);ctx.lineTo(x+7,y-44);ctx.lineTo(x+5,y+13);ctx.closePath();ctx.fill();
 line(x+2,y+8,x+5,y-32,"#fff",1);
}

function drawEnemy(e){
 let x=e.x-camera,y=floor()-42;
 ctx.save();if(e.dir>0){ctx.translate(x+28,0);ctx.scale(-1,1);x=0}else{x-=0}
 if(e.hit>0)ctx.globalAlpha=.6;
 // creature shadow
 ctx.globalAlpha*=.3;ctx.fillStyle="#000";ctx.beginPath();ctx.ellipse(x+15,floor()+2,20,5,0,0,7);ctx.fill();ctx.globalAlpha=e.hit>0?.6:1;
 // body
 rect(x+5,y+15,20,24,"#3d5148");rect(x+8,y+10,16,16,"#63725a");
 rect(x+6,y+36,8,7,"#26372f");rect(x+19,y+36,8,7,"#26372f");
 rect(x+8,y+5,5,9,"#63725a");rect(x+20,y+5,5,9,"#63725a");
 rect(x+9,y+16,4,3,"#ffb45e");rect(x+19,y+16,4,3,"#ffb45e");
 rect(x+12,y+25,9,3,"#202c27");
 if(e.hp<e.max){rect(x+2,y-7,30,4,"#17202a");rect(x+2,y-7,30*e.hp/e.max,4,"#d65a54")}
 ctx.restore();
}
function drawBoss(){
 if(boss.dead)return;
 let x=boss.x-camera,y=floor()-104;
 if(x<-150||x>W+150)return;
 ctx.save();
 ctx.globalAlpha=.3;ctx.fillStyle="#000";ctx.beginPath();ctx.ellipse(x+42,floor()+3,53,10,0,0,7);ctx.fill();ctx.globalAlpha=1;
 let rage=boss.rage>0;
 rect(x+13,y+27,58,66,rage?"#692b36":"#34404c");
 rect(x+20,y+12,45,35,rage?"#a4444b":"#71808a");
 rect(x+13,y+28,15,21,"#4b5962");rect(x+56,y+28,18,22,"#4b5962");
 rect(x+19,y+89,17,14,"#202a32");rect(x+49,y+89,17,14,"#202a32");
 rect(x+23,y+18,8,5,"#ffcf85");rect(x+51,y+18,8,5,"#ffcf85");
 rect(x+28,y+35,29,6,"#1c2630");
 // horns
 rect(x+15,y+4,8,16,"#aeb9b7");rect(x+58,y+4,8,16,"#aeb9b7");
 rect(x+8,y+44,12,9,"#85939a");rect(x+65,y+44,12,9,"#85939a");
 // rune glow
 ctx.globalAlpha=.7;circle(x+42,y+63,7,rage?"#ff5964":"#72c5d8");ctx.globalAlpha=1;
 if(rage){ctx.strokeStyle="#ff5964";ctx.lineWidth=3;ctx.beginPath();ctx.arc(x+42,y+51,54,0,Math.PI*2);ctx.stroke()}
 ctx.restore();
}
function drawNPC(){
 let x=npc.x-camera,y=floor()-48;
 if(x<-80||x>W+80)return;
 rect(x+8,y+16,18,25,"#315c6b");rect(x+10,y+2,15,15,"#d3ad8b");
 rect(x+8,y,18,7,"#b9c9c5");rect(x+7,y+2,4,10,"#526a75");
 rect(x+9,y+41,7,7,"#222b35");rect(x+20,y+41,7,7,"#222b35");
 rect(x+12,y+8,2,2,"#27313a");rect(x+21,y+8,2,2,"#27313a");
 text("!",x+13,y-10,17,"#f4d68a");
}

function update(dt){
 if(!playing)return;
 time+=dt;
 hero.anim+=dt*60;
 let speed=210;
 if(keys.left){hero.vx=-speed;hero.face=-1}
 else if(keys.right){hero.vx=speed;hero.face=1}
 else hero.vx*=Math.pow(.001,dt);
 if(hero.dash>0){hero.vx=hero.face*520;hero.dash-=dt*60}
 hero.x+=hero.vx*dt;
 hero.x=Math.max(20,Math.min(world.width-50,hero.x));
 hero.vy+=1250*dt;hero.y+=hero.vy*dt;
 if(hero.y+hero.h>=floor()){hero.y=floor()-hero.h;hero.vy=0;hero.onGround=true}else hero.onGround=false;
 hero.attack=Math.max(0,hero.attack-dt*60);
 hero.attackCd=Math.max(0,hero.attackCd-dt*60);
 hero.inv=Math.max(0,hero.inv-dt*60);
 hero.dashCd=Math.max(0,hero.dashCd-dt*60);
 hero.skillCd=Math.max(0,hero.skillCd-dt*60);
 if(hero.attack>0){
  for(let e of enemies){
   if(e.hp<=0)continue;
   if(Math.abs(e.x-hero.x)<75&&Math.abs((e.x-hero.x)*hero.face)<95&&e.hit<=0){
    e.hp-=20;e.hit=22;particle(e.x-camera+15,floor()-25,"#e4f4ff",10,4);
    floatText("-20",e.x-camera,floor()-55,"#fff0c4");
    if(e.hp<=0){hero.xp+=20;particle(e.x-camera,floor()-30,"#9de7c1",18,5)}
   }
  }
  if(!boss.dead&&Math.abs(boss.x-hero.x)<105&&Math.abs((boss.x-hero.x)*hero.face)<125&&boss.hit!==true){
   boss.hp-=20;boss.hit=true;setTimeout(()=>boss.hit=false,250);
   particle(boss.x-camera+40,floor()-60,"#a8dfff",15,5);
   floatText("-20",boss.x-camera,floor()-130,"#ffe5a4");
   if(boss.hp<=0){boss.hp=0;boss.dead=true;hero.xp+=100;particle(boss.x-camera+40,floor()-60,"#ffcf78",50,7)}
  }
 }
 for(let e of enemies){
  if(e.hp<=0)continue;
  e.hit=Math.max(0,e.hit-dt*60);e.anim+=dt*60;
  let dx=hero.x-e.x;
  if(Math.abs(dx)<270){e.dir=dx>0?1:-1;e.x+=e.dir*65*dt}
  if(Math.abs(dx)<42&&hero.inv<=0){
   hero.hp-=12*dt;hero.inv=12;hero.vx=hero.x<e.x?-130:130;
   floatText("!",hero.x-camera,floor()-80,"#ff9a9a");
  }
 }
 let dist=Math.abs(hero.x-boss.x);
 if(dist<480&&!boss.dead)boss.active=true;
 if(boss.active&&!boss.dead){
  if(boss.hp<=boss.max*.3&&boss.rage<=0)boss.rage=60;
  if(boss.rage>0)boss.rage=Math.max(0,boss.rage-dt);
  let dx=hero.x-boss.x;
  if(Math.abs(dx)>60)boss.x+=Math.sign(dx)*(boss.rage>0?210:105)*dt;
  if(Math.abs(dx)<76&&hero.inv<=0){
   hero.hp-= (boss.rage>0?20:16)*dt;
   if(Math.random()<.08){hero.inv=10;hero.vx=hero.x<boss.x?-180:180}
  }
 }
 for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life--}
 particles=particles.filter(p=>p.life>0);
 for(let f of floating){f.y-=.7;f.life--}
 floating=floating.filter(f=>f.life>0);
 camera=Math.max(0,Math.min(world.width-W,hero.x-W*.42));
 document.getElementById("hp").style.width=Math.max(0,hero.hp/hero.max*100)+"%";
 document.getElementById("xp").style.width=(hero.xp%100)+"%";
 document.getElementById("stats").textContent=`HP ${Math.max(0,Math.ceil(hero.hp))} / 100     EXP ${hero.xp}`;
 document.getElementById("bossHud").style.display=boss.active&&!boss.dead?"block":"none";
 document.getElementById("bossHp").style.width=(boss.hp/boss.max*100)+"%";
 if(hero.hp<=0){hero.hp=0;gameOver()}
}

function draw(){
 ctx.clearRect(0,0,W,H);drawBackground();
 // little scenery flowers
 for(let i=0;i<14;i++){
  let x=((i*275-camera)%(W+100)+W+100)%(W+100)-30;
  rect(x,floor()-7,2,7,"#82916c");circle(x+2,floor()-8,3,"#c7b88a");
 }
 drawNPC();
 enemies.forEach(e=>{if(e.hp>0)drawEnemy(e)});
 drawBoss();drawHero();
 for(let p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);rect(p.x,p.y,p.size,p.size,p.color)}
 ctx.globalAlpha=1;
 for(let f of floating){ctx.globalAlpha=f.life/48;text(f.t,f.x,f.y,15,f.color)}
 ctx.globalAlpha=1;
 if(boss.rage>0&&!boss.dead)text("CUỒNG NỘ: "+Math.ceil(boss.rage)+"s",W/2-48,95,12,"#ff9b9b");
 if(hero.x>npc.x-55&&hero.x<npc.x+65){
  text("NHÂN VẬT: Chào kiếm sĩ!",W/2-75,H*.25,13,"#fff1c7");
 }
 if(boss.dead){
  text("KẺ CANH GIỮ ĐÃ BỊ ĐÁNH BẠI",W/2-115,H*.25,16,"#ffe1a0");
 }
}
function loop(ts){
 let dt=Math.min((ts-last)/1000||0,.035);last=ts;
 update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function attack(){
 if(!playing||hero.attackCd>0)return;
 hero.attack=16;hero.attackCd=23;
}
function jump(){if(playing&&hero.onGround){hero.vy=-510;hero.onGround=false;particle(hero.x-camera+16,floor()-3,"#b9c8d0",5,2)}}
function dash(){
 if(!playing||hero.dashCd>0)return;
 hero.dash=9;hero.dashCd=70;hero.inv=12;
 particle(hero.x-camera+16,hero.y+35,"#9cc9e8",10,3);
}
function skill(){
 if(!playing||hero.skillCd>0)return;
 hero.skillCd=150;hero.attack=20;hero.attackCd=25;
 particle(hero.x-camera+17,hero.y+25,"#a8dcff",24,6);
 // kỹ năng chém mạnh: tác động lên mục tiêu phía trước
 for(let e of enemies)if(e.hp>0&&Math.abs(e.x-hero.x)<145&&Math.sign(e.x-hero.x)===hero.face){e.hp-=25;particle(e.x-camera,floor()-25,"#d7f2ff",12,5)}
 if(!boss.dead&&Math.abs(boss.x-hero.x)<160&&Math.sign(boss.x-hero.x)===hero.face){boss.hp=Math.max(0,boss.hp-25);particle(boss.x-camera+40,floor()-60,"#d7f2ff",18,5)}
}
function gameOver(){
 playing=false;
 document.querySelector(".panel h1").innerHTML="HÀNH TRÌNH<br>TẠM DỪNG";
 document.querySelector(".panel p").innerHTML="Kiếm sĩ cần nghỉ ngơi trước khi tiếp tục.";
 document.getElementById("startBtn").textContent="CHƠI LẠI";
 document.getElementById("startScreen").style.display="flex";
}
document.getElementById("startBtn").addEventListener("click",()=>{
 reset();playing=true;document.getElementById("startScreen").style.display="none";
});
function bindHold(id,down,up){
 let el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{e.preventDefault();el.classList.add("down");down()});
 const release=e=>{el.classList.remove("down");up&&up()};
 el.addEventListener("pointerup",release);el.addEventListener("pointercancel",release);
 el.addEventListener("lostpointercapture",release);
}
bindHold("left",()=>keys.left=true,()=>keys.left=false);
bindHold("right",()=>keys.right=true,()=>keys.right=false);
bindHold("jump",jump);
bindHold("dash",dash);
bindHold("skill",skill);
bindHold("attack",attack);
addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
 if(e.key===" "||e.key==="ArrowUp")jump();
 if(e.key==="j")attack();
 if(e.key==="k")skill();
 if(e.key==="Shift")dash();
});
addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
});
reset();draw();
</script>
</body>
</html>
