
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kiếm Sĩ Lang Thang</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101722;color:#fff;font-family:Arial;touch-action:none}
#game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#172536}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:10px;left:12px;z-index:3;font-size:12px;text-shadow:1px 2px 3px #000;pointer-events:none}
.bar{height:10px;width:170px;background:#292d38;border:1px solid #aaa;border-radius:8px;overflow:hidden;margin:4px 0 7px}
.fill{height:100%;width:100%}
#hp{background:#e84b55}#xp{background:#e6bb53}
#top{position:absolute;right:10px;top:10px;z-index:5;display:flex;gap:6px}
.ui{background:#111b;color:white;border:1px solid #ffffff66;border-radius:9px;padding:9px 11px}
#bossHud{display:none;position:absolute;top:12px;left:50%;transform:translateX(-50%);width:min(270px,50vw);text-align:center;font-size:12px;text-shadow:1px 2px 3px #000;z-index:3}
#bossbar{height:10px;background:#333;border:1px solid #ddd;border-radius:8px;overflow:hidden}
#bossfill{height:100%;width:100%;background:#d32f50}
#controls{position:absolute;bottom:13px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 15px;z-index:4;pointer-events:none}
.group{display:flex;align-items:end;gap:9px;pointer-events:auto}
.ctrl{width:55px;height:55px;border-radius:50%;border:1.5px solid #ffffff80;background:#ffffff19;color:#fff;font-size:23px;display:grid;place-items:center;user-select:none;backdrop-filter:blur(3px);touch-action:none;padding:0}
.ctrl:active{background:#ffffff50}
.ctrl.big{width:70px;height:70px}
.ctrl.small{width:48px;height:48px;font-size:18px}
#attack svg{width:43px;height:43px}
#overlay{display:none;position:absolute;inset:0;z-index:8;background:#080d17df;align-items:center;justify-content:center;padding:12px}
.panel{width:min(430px,95vw);max-height:90%;overflow:auto;text-align:center;padding:22px;border-radius:16px;border:1px solid #ffffff55;background:linear-gradient(145deg,#293b50,#111a29);box-shadow:0 15px 50px #000}
h1{color:#f0cf8a;font-size:clamp(25px,6vw,40px)}
button{cursor:pointer}
.main{background:linear-gradient(#f2ce7c,#ad7134);border:0;border-radius:9px;padding:12px 22px;font-size:16px;font-weight:bold;margin:6px;color:#21170d}
.item{padding:10px;margin:7px 0;background:#ffffff12;border:1px solid #ffffff35;border-radius:9px;text-align:left}
#toast{position:absolute;top:28%;left:50%;transform:translateX(-50%);padding:9px 15px;background:#101a;border:1px solid #ffffff55;border-radius:9px;z-index:7;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#hint{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);font-size:11px;color:#ffffffa0;text-shadow:1px 1px 2px #000;white-space:nowrap}
@media(orientation:landscape){
 #controls{padding:0 25px 5px}
 .ctrl{width:60px;height:60px}
 .ctrl.big{width:76px;height:76px}
 #hud .bar{width:190px}
}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>

<div id="hud">
 <b id="zoneName">RỪNG CỔ</b><br>
 ❤️ <span id="hpText">100/100</span>
 <div class="bar"><div id="hp" class="fill"></div></div>
 ⭐ Cấp <span id="level">1</span> · EXP <span id="exp">0</span>/<span id="need">50</span>
 <div class="bar"><div id="xp" class="fill" style="width:0%"></div></div>
 🪙 <span id="gold">0</span>
</div>

<div id="bossHud">
 <b id="bossName">BOSS</b>
 <div id="bossbar"><div id="bossfill"></div></div>
</div>

<div id="top">
 <button class="ui" onclick="openInventory()">🎒 Túi đồ</button>
 <button class="ui" onclick="pause()">Ⅱ</button>
</div>

<div id="toast"></div>
<div id="hint">◀ ▶ Di chuyển · ↑ Nhảy · Kiếm Tấn công</div>

<div id="controls">
 <div class="group">
  <button class="ctrl" id="left">◀</button>
  <button class="ctrl" id="right">▶</button>
 </div>
 <div class="group">
  <button class="ctrl small" id="jump">↑</button>
  <button class="ctrl big" id="attack" aria-label="Tấn công">
   <svg viewBox="0 0 60 60" fill="none">
    <path d="M12 45 L19 38 L42 9 Q46 5 49 9 Q52 12 48 17 L25 42 L18 49 Z" fill="#dce9ef" stroke="#fff" stroke-width="2"/>
    <path d="M17 37 L28 47 M12 43 L22 53" stroke="#d5a45b" stroke-width="5" stroke-linecap="round"/>
    <path d="M40 13 L46 18" stroke="#fff" stroke-width="2"/>
   </svg>
  </button>
  <button class="ctrl small" id="dash">➤</button>
  <button class="ctrl small" id="skill">✦</button>
 </div>
</div>

<div id="overlay"><div class="panel" id="panel"></div></div>
</div>

<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
let W=0,H=0,D=1,ground=0;
function resize(){
 D=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=Math.floor(W*D);canvas.height=Math.floor(H*D);
 ground=H*.79;
 if(player&&player.onGround)player.y=ground-player.h;
}
addEventListener("resize",resize);

const areas=[
 {name:"RỪNG CỔ",sky:"#182d3b",ground:"#304b38",tree:"#244a3a",enemy:"Linh thể rừng",boss:"Mộc vương"},
 {name:"HẦM NGỤC BỎ HOANG",sky:"#252432",ground:"#514047",tree:"#40303b",enemy:"Chiến binh xương",boss:"Kỵ sĩ cổ"},
 {name:"NÚI TUYẾT",sky:"#30465d",ground:"#a9c2d2",tree:"#52778e",enemy:"Thú băng",boss:"Băng long"},
 {name:"THÀNH TRÌ BÓNG TỐI",sky:"#251b35",ground:"#483047",tree:"#38243e",enemy:"Quỷ vệ",boss:"Chúa tể bóng tối"}
];

let player=null,zone=0,camera=0,worldWidth=2600;
let enemies=[],drops=[],particles=[],npcs=[],boss=null;
let inventory=[],gold=0,level=1,exp=0,need=50;
let running=false,paused=false,gameOver=false,frame=0,last=0;
let held={left:false,right:false};
let attackCooldown=0,skillCooldown=0,dashCooldown=0;
let toastTimer=0;

function resetPlayer(){
 player={x:120,y:ground-54,w:34,h:54,vx:0,vy:0,hp:100,maxHp:100,damage:20,def:0,face:1,onGround:true,inv:0,anim:0,attack:0,dash:0};
}
function notify(t){
 const el=document.getElementById("toast");
 el.textContent=t;el.style.opacity=1;
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>el.style.opacity=0,1400);
}
function showPanel(html){
 document.getElementById("panel").innerHTML=html;
 document.getElementById("overlay").style.display="flex";
}
function startGame(){
 document.getElementById("overlay").style.display="none";
 if(!player)resetPlayer();
 running=true;paused=false;gameOver=false;
 if(enemies.length===0)makeZone();
 last=performance.now();
 requestAnimationFrame(loop);
}
function makeZone(){
 enemies=[];drops=[];npcs=[];
 worldWidth=2600+zone*300;
 for(let i=0;i<9;i++)spawnEnemy(450+i*225);
 npcs.push({x:270,name:"Nhà thám hiểm"});
 boss={x:worldWidth-250,y:0,w:70,h:90,hp:player.maxHp*2,max:player.maxHp*2,active:false,angry:false,timer:0,attack:0};
 document.getElementById("zoneName").textContent=areas[zone].name;
 document.getElementById("bossHud").style.display="none";
}
function spawnEnemy(x){
 enemies.push({x,y:ground-42,w:34,h:42,hp:45+zone*18,max:45+zone*18,face:-1,attack:0,dead:false,hit:0,speed:45+zone*8});
}
function gainExp(n){
 exp+=n;
 while(exp>=need){
  exp-=need;level++;need=Math.floor(need*1.35);
  player.maxHp+=12;player.hp=player.maxHp;player.damage+=3;
  notify("LÊN CẤP "+level+"! Sức mạnh tăng lên");
 }
}
function updateHud(){
 document.getElementById("hpText").textContent=Math.max(0,Math.ceil(player.hp))+"/"+player.maxHp;
 document.getElementById("hp").style.width=Math.max(0,player.hp/player.maxHp*100)+"%";
 document.getElementById("level").textContent=level;
 document.getElementById("exp").textContent=exp;
 document.getElementById("need").textContent=need;
 document.getElementById("xp").style.width=exp/need*100+"%";
 document.getElementById("gold").textContent=gold;
 if(boss&&boss.active){
  document.getElementById("bossHud").style.display="block";
  document.getElementById("bossName").textContent=areas[zone].boss+(boss.angry?" · CUỒNG NỘ":"");
  document.getElementById("bossfill").style.width=Math.max(0,boss.hp/boss.max*100)+"%";
 }
}
function killEnemy(e){
 if(e.dead)return;
 e.dead=true;gold+=5+zone*3;gainExp(12+zone*4);
 drops.push({x:e.x,y:ground-30,type:Math.random()<.55?"coin":"potion"});
 if(Math.random()<.28)drops.push({x:e.x+15,y:ground-28,type:"gear"});
}
function attack(){
 if(!running||paused||gameOver||attackCooldown>0)return;
 player.attack=.23;attackCooldown=.38;
 for(let e of enemies){
  if(e.dead)continue;
  let dx=e.x-player.x;
  if(Math.abs(dx)<78&&Math.sign(dx||1)===player.face){
   e.hp-=player.damage;e.hit=.16;
   burst(e.x+e.w/2,ground-30,"#f4d18a",8);
   if(e.hp<=0)killEnemy(e);
  }
 }
 if(boss&&boss.active&&Math.abs(boss.x-player.x)<110&&Math.sign(boss.x-player.x||1)===player.face){
  boss.hp-=player.damage;burst(boss.x,ground-65,"#e5b7ff",10);
  if(boss.hp<=0)defeatBoss();
 }
}
function defeatBoss(){
 if(!boss||boss.hp<=0)return;
 boss.hp=0;boss.active=false;
 gold+=100;gainExp(100);
 drops.push({x:boss.x,y:ground-35,type:"rare"});
 notify("BOSS ĐÃ BỊ ĐÁNH BẠI!");
 setTimeout(()=>{
  if(!running)return;
  if(zone<3){
   zone++;makeZone();player.x=120;camera=0;
   notify("KHU VỰC MỚI: "+areas[zone].name);
  }else{
   running=false;
   showPanel("<h1>CHIẾN THẮNG!</h1><p>Bạn đã chinh phục cả bốn vùng đất.</p><button class='main' onclick='restartGame()'>Chơi lại</button>");
  }
 },900);
}
function burst(x,y,color,n){
 for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*220,vy:(Math.random()-.7)*180,life:.4,color});
}
function jump(){
 if(player&&player.onGround&&running&&!paused){player.vy=-440;player.onGround=false;}
}
function dash(){
 if(!player||dashCooldown>0||paused||!running)return;
 player.vx=player.face*550;player.dash=.18;player.inv=.25;dashCooldown=1.2;
 burst(player.x,player.y+25,"#a9dfff",7);
 for(let e of enemies){
  if(!e.dead&&Math.abs(e.x-player.x)<90){
   e.hp-=player.damage*1.5;
   if(e.hp<=0)killEnemy(e);
  }
 }
}
function skill(){
 if(!player||skillCooldown>0||paused||!running)return;
 skillCooldown=3;player.attack=.4;
 for(let e of enemies){
  if(!e.dead&&Math.abs(e.x-player.x)<155){
   e.hp-=player.damage*2;
   burst(e.x,ground-30,"#ffe3a1",12);
   if(e.hp<=0)killEnemy(e);
  }
 }
 if(boss&&boss.active&&Math.abs(boss.x-player.x)<185){
  boss.hp-=player.damage*2;
  if(boss.hp<=0)defeatBoss();
 }
 notify("XOAY KIẾM!");
}
function update(dt){
 if(!running||paused||gameOver)return;
 frame++;
 attackCooldown=Math.max(0,attackCooldown-dt);
 skillCooldown=Math.max(0,skillCooldown-dt);
 dashCooldown=Math.max(0,dashCooldown-dt);
 player.attack=Math.max(0,player.attack-dt);
 player.inv=Math.max(0,player.inv-dt);
 player.dash=Math.max(0,player.dash-dt);
 let speed=190;
 if(player.dash<=0){
  player.vx=0;
  if(held.left){player.vx=-speed;player.face=-1;}
  if(held.right){player.vx=speed;player.face=1;}
 }
 player.x+=player.vx*dt;
 player.x=Math.max(20,Math.min(worldWidth-80,player.x));
 player.vy+=1050*dt;
 player.y+=player.vy*dt;
 if(player.y+player.h>=ground){
  player.y=ground-player.h;player.vy=0;player.onGround=true;
 }else player.onGround=false;

 for(let e of enemies){
  if(e.dead)continue;
  e.hit=Math.max(0,e.hit-dt);
  let dx=player.x-e.x;
  if(Math.abs(dx)<330){
   e.face=dx>0?1:-1;e.x+=e.face*e.speed*dt;
  }
  if(Math.abs(dx)<37&&Math.abs(player.y+player.h-e.y-e.h)<35&&player.inv<=0){
   player.hp-=Math.max(1,12-player.def);
   player.inv=.65;
   if(player.hp<=0)endGame();
  }
 }
 if(boss){
  if(player.x>worldWidth-650)boss.active=true;
  if(boss.active&&boss.hp>0){
   boss.attack-=dt;
   let dx=player.x-boss.x;
   boss.x+=Math.sign(dx)*(boss.angry?190:75)*dt;
   if(boss.hp<boss.max*.3&&!boss.angry){boss.angry=true;boss.timer=60;notify("BOSS CUỒNG NỘ!");}
   if(boss.angry&&boss.timer>0)boss.timer-=dt;
   if(boss.angry&&boss.timer<=0)boss.angry=false;
   if(Math.abs(dx)<65&&boss.attack<=0&&player.inv<=0){
    player.hp-=boss.angry?20:16;player.inv=.7;boss.attack=1.2;
    if(player.hp<=0)endGame();
   }
  }
 }
 for(let d of drops){
  if(!d.got&&Math.abs(d.x-player.x)<35){
   d.got=true;
   if(d.type==="coin"){gold+=5;notify("+5 vàng");}
   if(d.type==="potion"){player.hp=Math.min(player.maxHp,player.hp+30);notify("Đã hồi 30 máu");}
   if(d.type==="gear"){inventory.push("Giáp du hành");player.def+=2;notify("Nhặt giáp: phòng thủ +2");}
   if(d.type==="rare"){inventory.push("Trang bị Boss");player.damage+=5;notify("Nhận trang bị Boss: sát thương +5");}
  }
 }
 drops=drops.filter(d=>!d.got);
 for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}
 particles=particles.filter(p=>p.life>0);
 camera+=(Math.max(0,player.x-W/D*.4)-camera)*Math.min(1,dt*5);
 updateHud();
}
function drawBackground(){
 let z=areas[zone];
 ctx.fillStyle=z.sky;ctx.fillRect(0,0,W,H);
 for(let i=0;i<12;i++){
  let x=((i*340-camera*.25)%(W+340)+W+340)%(W+340)-100;
  ctx.fillStyle=z.tree;ctx.beginPath();
  ctx.moveTo(x,ground);ctx.lineTo(x+75,ground-170-(i%3)*35);ctx.lineTo(x+150,ground);ctx.fill();
  ctx.fillStyle="#ffffff12";ctx.fillRect(x+68,ground-155,8,90);
 }
 ctx.fillStyle=z.ground;ctx.fillRect(0,ground,W,H-ground);
 ctx.fillStyle="#ffffff28";ctx.fillRect(0,ground,W,4);
 for(let i=0;i<45;i++){
  let x=((i*83-camera)%(W+83)+W+83)%(W+83);
  ctx.fillStyle="#ffffff25";ctx.fillRect(x,ground+12+(i%4)*10,18,2);
 }
}
function drawPlayer(){
 let x=player.x-camera,y=player.y;
 ctx.save();ctx.translate(x+player.w/2,y);
 if(player.face<0)ctx.scale(-1,1);
 if(player.inv>0&&Math.floor(frame/5)%2===0)ctx.globalAlpha=.45;
 let step=Math.abs(player.vx)>10?Math.sin(player.anim)*5:0;
 // khăn choàng
 ctx.fillStyle="#8d293d";ctx.beginPath();
 ctx.moveTo(-7,15);ctx.lineTo(-25,28+step);ctx.lineTo(-18,43);ctx.lineTo(2,31);ctx.fill();
 // chân và giày
 ctx.fillStyle="#252c39";
 ctx.fillRect(-9,39+step,8,14);ctx.fillRect(3,39-step,8,14);
 ctx.fillStyle="#a5aeb9";
 ctx.fillRect(-11,50+step,12,4);ctx.fillRect(2,50-step,13,4);
 // thân áo
 ctx.fillStyle="#34465b";ctx.fillRect(-11,15,23,26);
 ctx.fillStyle="#aab6c3";ctx.fillRect(-9,18,18,4);
 ctx.fillStyle="#8f3445";ctx.fillRect(-3,17,5,22);
 // giáp vai
 ctx.fillStyle="#b8c5d0";ctx.fillRect(-14,16,8,8);ctx.fillRect(7,16,8,8);
 // đầu
 ctx.fillStyle="#e6b995";ctx.fillRect(-8,2,16,15);
 ctx.fillStyle="#25202b";ctx.fillRect(-9,0,18,6);ctx.fillRect(-11,4,5,8);
 ctx.fillStyle="#f0d2a4";ctx.fillRect(2,9,3,2);
 // tóc
 ctx.fillStyle="#25202b";ctx.fillRect(-9,-3,18,6);ctx.fillRect(-12,0,7,7);
 // tay
 ctx.fillStyle="#d9b08c";ctx.fillRect(9,22,7,12);
 ctx.fillStyle="#46556a";ctx.fillRect(8,19,8,7);
 // kiếm
 ctx.save();
 if(player.attack>0){
  ctx.rotate(-.9+Math.sin(frame*1.5)*.15);
 }else if(player.dash>0)ctx.rotate(-.25);
 else ctx.rotate(-.45);
 ctx.fillStyle="#d7e5ee";ctx.beginPath();
 ctx.moveTo(12,29);ctx.lineTo(17,26);ctx.lineTo(43,-10);ctx.lineTo(47,-8);ctx.lineTo(22,33);ctx.closePath();ctx.fill();
 ctx.strokeStyle="#fff";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(18,27);ctx.lineTo(44,-8);ctx.stroke();
 ctx.strokeStyle="#d8a95f";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(12,28);ctx.lineTo(23,35);ctx.stroke();
 ctx.fillStyle="#71472c";ctx.fillRect(18,31,5,11);
 ctx.restore();
 ctx.restore();
}
function drawEnemy(e){
 if(e.dead)return;
 let x=e.x-camera,y=ground-e.h;
 ctx.save();ctx.translate(x+e.w/2,y);
 if(e.face<0)ctx.scale(-1,1);
 if(e.hit>0)ctx.globalAlpha=.5;
 // thân quái
 let color=["#69b87b","#b8a1a0","#8ac7e0","#a34c78"][zone];
 ctx.fillStyle=color;
 ctx.beginPath();ctx.moveTo(-17,39);ctx.lineTo(-14,13);ctx.lineTo(-7,5);ctx.lineTo(8,5);ctx.lineTo(17,16);ctx.lineTo(15,39);ctx.closePath();ctx.fill();
 ctx.fillStyle="#27303a";ctx.fillRect(-10,17,5,4);ctx.fillRect(7,17,5,4);
 ctx.fillStyle="#fff";ctx.fillRect(-9,17,2,2);ctx.fillRect(8,17,2,2);
 ctx.fillStyle="#34313a";ctx.fillRect(-12,38,9,4);ctx.fillRect(4,38,9,4);
 ctx.restore();
 ctx.fillStyle="#231d27";ctx.fillRect(x-3,y-9,40,5);
 ctx.fillStyle="#e34d59";ctx.fillRect(x-3,y-9,40*Math.max(0,e.hp/e.max),5);
}
function drawBoss(){
 if(!boss||!boss.active||boss.hp<=0)return;
 let x=boss.x-camera,y=ground-boss.h;
 ctx.save();ctx.translate(x+boss.w/2,y);
 let angry=boss.angry;
 ctx.fillStyle=angry?"#b52d50":"#54415f";
 ctx.fillRect(-27,20,54,66);
 ctx.fillStyle=angry?"#f2b1c1":"#a8a0b8";
 ctx.fillRect(-21,9,42,28);
 ctx.fillStyle="#25202c";ctx.fillRect(-24,5,48,9);
 ctx.fillStyle="#f3d47a";ctx.fillRect(-14,19,7,5);ctx.fillRect(7,19,7,5);
 ctx.fillStyle="#30313c";ctx.fillRect(-22,82,17,8);ctx.fillRect(6,82,17,8);
 ctx.fillStyle="#8d354c";ctx.fillRect(-34,30,9,35);ctx.fillRect(25,30,9,35);
 ctx.fillStyle="#dce5ef";ctx.fillRect(25,35,7,35);
 ctx.restore();
}
function drawNPC(n){
 let x=n.x-camera;if(x<-40||x>W+40)return;
 ctx.fillStyle="#d5a46c";ctx.fillRect(x-8,ground-49,17,18);
 ctx.fillStyle="#476b83";ctx.fillRect(x-12,ground-31,24,29);
 ctx.fillStyle="#29212c";ctx.fillRect(x-9,ground-54,18,8);
 ctx.fillStyle="#fff";ctx.font="11px Arial";ctx.textAlign="center";
 ctx.fillText("NPC",x,ground-62);
}
function drawWorld(){
 drawBackground();
 // cột đá, cỏ và bụi trang trí
 for(let i=0;i<18;i++){
  let x=(i*175-camera*.8)%(W+175);
  if(x<0)x+=W+175;
  ctx.fillStyle="#ffffff16";ctx.fillRect(x,ground-9,3,9);
 }
 for(let n of npcs)drawNPC(n);
 for(let e of enemies)drawEnemy(e);
 drawBoss();
 for(let d of drops){
  let x=d.x-camera,y=d.y;
  ctx.fillStyle=d.type==="coin"?"#f5ce50":d.type==="potion"?"#e95c70":d.type==="rare"?"#c78aff":"#b7c8d6";
  ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff";ctx.fillRect(x-2,y-5,4,3);
 }
 for(let p of particles){
  ctx.globalAlpha=Math.max(0,p.life/.4);
  ctx.fillStyle=p.color;ctx.fillRect(p.x-camera,p.y,4,4);
 }
 ctx.globalAlpha=1;
 drawPlayer();
}
function render(){
 ctx.setTransform(D,0,0,D,0,0);
 let sx=0,sy=0;
 if(shake>0){sx=(Math.random()-.5)*shake;sy=(Math.random()-.5)*shake;shake*=.8;if(shake<.3)shake=0;}
 ctx.clearRect(0,0,W,H);
 ctx.save();ctx.translate(sx,sy);
 drawWorld();
 ctx.restore();
}
let shake=0;
function loop(now){
 if(!running)return;
 let dt=Math.min(.035,(now-last)/1000||0);last=now;
 update(dt);render();
 if(running)requestAnimationFrame(loop);
}
function endGame(){
 if(gameOver)return;
 gameOver=true;running=false;
 showPanel("<h1>BẠN ĐÃ GỤC NGÃ</h1><p>Hành trình chưa kết thúc. Hãy thử lại nhé!</p><button class='main' onclick='restartGame()'>CHƠI LẠI</button>");
}
function restartGame(){
 zone=0;level=1;exp=0;need=50;gold=0;inventory=[];
 attackCooldown=0;skillCooldown=0;dashCooldown=0;
 resetPlayer();makeZone();startGame();
}
function pause(){
 if(!running)return;
 paused=!paused;
 if(paused){
  showPanel("<h2>TẠM DỪNG</h2><button class='main' onclick='resumeGame()'>TIẾP TỤC</button><button class='main' onclick='restartGame()'>CHƠI LẠI</button>");
 }else resumeGame();
}
function resumeGame(){
 document.getElementById("overlay").style.display="none";
 paused=false;last=performance.now();
 if(running)requestAnimationFrame(loop);
}
function openInventory(){
 if(!player)return;
 paused=true;
 let html="<h2>🎒 TÚI ĐỒ</h2><p>Vàng: "+gold+"</p>";
 html+="<div class='item'>⚔️ Kiếm hiện tại · Sát thương: "+player.damage+"</div>";
 html+="<div class='item'>🛡️ Phòng thủ: "+player.def+"</div>";
 html+="<div class='item'>❤️ Máu: "+Math.ceil(player.hp)+"/"+player.maxHp+"</div>";
 html+="<div class='item'>🧪 Bình máu · <button onclick='usePotion()'>Sử dụng</button> ("+inventory.filter(x=>x==="Bình máu").length+")</div>";
 if(inventory.length===0)html+="<p>Chưa có vật phẩm khác. Hãy đánh quái để nhặt đồ!</p>";
 inventory.forEach((it,i)=>{if(it!=="Bình máu")html+="<div class='item'>"+it+"</div>";});
 html+="<button class='main' onclick='closeInventory()'>ĐÓNG</button>";
 showPanel(html);
}
function usePotion(){
 let i=inventory.indexOf("Bình máu");
 if(i<0){notify("Bạn không có bình máu");return;}
 inventory.splice(i,1);player.hp=Math.min(player.maxHp,player.hp+45);
 openInventory();updateHud();
}
function closeInventory(){
 document.getElementById("overlay").style.display="none";
 paused=false;last=performance.now();requestAnimationFrame(loop);
}
function closePanel(){
 document.getElementById("overlay").style.display="none";
 paused=false;last=performance.now();requestAnimationFrame(loop);
}
function interact(){
 let n=npcs.find(n=>Math.abs(n.x-player.x)<85);
 if(n){
  paused=true;
  showPanel("<h2>NHÀ THÁM HIỂM</h2><p>Con đường phía trước rất nguy hiểm. Hãy thu thập vật phẩm và nâng cấp sức mạnh trước khi gặp Boss!</p><button class='main' onclick='closePanel()'>ĐÃ HIỂU</button>");
 }
}

// Điều khiển cảm ứng: giữ nút để di chuyển
function bindHold(id,key){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{e.preventDefault();held[key]=true;el.setPointerCapture(e.pointerId);});
 el.addEventListener("pointerup",e=>{e.preventDefault();held[key]=false;});
 el.addEventListener("pointercancel",()=>held[key]=false);
 el.addEventListener("lostpointercapture",()=>held[key]=false);
}
bindHold("left","left");bindHold("right","right");
document.getElementById("jump").addEventListener("pointerdown",e=>{e.preventDefault();jump();});
document.getElementById("attack").addEventListener("pointerdown",e=>{e.preventDefault();attack();});
document.getElementById("dash").addEventListener("pointerdown",e=>{e.preventDefault();dash();});
document.getElementById("skill").addEventListener("pointerdown",e=>{e.preventDefault();skill();});

addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")held.left=true;
 if(e.key==="ArrowRight"||e.key==="d")held.right=true;
 if(e.key===" "||e.key==="ArrowUp")jump();
 if(e.key==="j")attack();
 if(e.key==="k")dash();
 if(e.key==="l")skill();
 if(e.key==="e")interact();
});
addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")held.left=false;
 if(e.key==="ArrowRight"||e.key==="d")held.right=false;
});
resize();
resetPlayer();
render();
showPanel("<h1>KIẾM SĨ LANG THANG</h1><p>Một hành trình mới đang chờ đợi...</p><p>Khám phá vùng đất, chiến đấu với quái vật và chinh phục bốn Boss.</p><button class='main' onclick='startGame()'>BẮT ĐẦU</button><p style='font-size:12px;color:#c4ced9'>Chạm nút điều khiển hoặc dùng bàn phím để chơi.</p>");
</script>
</div>
