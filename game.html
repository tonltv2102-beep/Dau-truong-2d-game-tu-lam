<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Go to Wonderland</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#142b25;font-family:Arial,sans-serif;
 touch-action:none;
}
#game{
 width:100%;height:100%;display:block;
 image-rendering:pixelated;
}
#menu{
 position:fixed;inset:0;display:flex;
 flex-direction:column;align-items:center;
 justify-content:center;text-align:center;
 background:linear-gradient(#173d35aa,#10251ddd),
 url("https://images.unsplash.com/photo-1448375240586-882707db888b?w=1200") center/cover;
 color:white;z-index:5;
}
h1{
 font-size:clamp(30px,8vw,65px);
 color:#ffe58a;
 text-shadow:4px 5px #713e27;
 margin:10px;
}
.subtitle{font-size:15px;color:#d9f5d3}
button{
 border:3px solid #fff0b0;border-radius:14px;
 background:linear-gradient(#ffe68b,#e99c42);
 color:#59361e;font-weight:bold;
 padding:14px 35px;font-size:20px;
 box-shadow:0 5px #874c27;
}
#start{margin-top:30px}
#hud{
 position:fixed;top:10px;left:10px;
 color:white;font-weight:bold;
 text-shadow:2px 2px #234;
 z-index:2;display:none;
}
#controls{
 position:fixed;bottom:18px;left:0;right:0;
 display:none;justify-content:space-between;
 padding:0 18px;z-index:3;
}
.group{display:flex;gap:12px}
.control{
 width:65px;height:65px;padding:0;
 border-radius:50%;font-size:25px;
 background:#ffffff88;color:#183d32;
 border:2px solid white;box-shadow:0 4px #315b48;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="menu">
 <h1>GO TO<br>WONDERLAND</h1>
 <div class="subtitle">A Magical 2D Adventure</div>
 <button id="start">CHƠI NGAY ▶</button>
 <p>Khám phá thế giới thần tiên!</p>
</div>

<div id="hud">❤️ <span id="hp">5</span> &nbsp; 💎 <span id="coins">0</span></div>

<div id="controls">
 <div class="group">
  <button class="control" id="left">◀</button>
  <button class="control" id="right">▶</button>
 </div>
 <div class="group">
  <button class="control" id="jump">⬆</button>
  <button class="control" id="attack">⚔</button>
 </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=0,H=0;
function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

const world={
 width:5000,
 ground:0,
 camera:0
};

let player={
 x:150,y:0,vx:0,vy:0,
 width:32,height:46,
 speed:4,jumping:false,
 hp:5,coins:0,
 direction:1,attacking:0
};

let keys={left:false,right:false};
let started=false;
let trees=[];
let gems=[];
let enemies=[];

function random(a,b){
 return Math.random()*(b-a)+a;
}

for(let i=0;i<100;i++){
 trees.push({
  x:random(0,world.width),
  size:random(35,85),
  shade:Math.floor(random(0,3))
 });
}

for(let i=0;i<45;i++){
 gems.push({
  x:random(300,world.width-100),
  y:random(0,100),
  taken:false
 });
}

for(let i=0;i<18;i++){
 enemies.push({
  x:random(500,world.width-200),
  y:0,alive:true,
  speed:random(0.5,1.2)
 });
}

function startGame(){
 document.getElementById("menu").style.display="none";
 document.getElementById("hud").style.display="block";
 document.getElementById("controls").style.display="flex";
 started=true;
 player.y=H-130;
 world.ground=H-65;
 requestAnimationFrame(loop);
}

document.getElementById("start").onclick=startGame;
 // VẼ BẦU TRỜI
function drawSky(){
 let sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,"#70c9f5");
 sky.addColorStop(0.65,"#c9edb0");
 sky.addColorStop(1,"#e9f6bd");
 ctx.fillStyle=sky;
 ctx.fillRect(0,0,W,H);

 // Mặt trời
 ctx.fillStyle="#fff2a0";
 ctx.beginPath();
 ctx.arc(W-100,90,40,0,Math.PI*2);
 ctx.fill();

 // Mây
 ctx.fillStyle="#ffffffcc";
 for(let i=0;i<7;i++){
  let x=((i*230-world.camera*0.2)%(W+300)+W+300)%(W+300)-100;
  let y=60+(i%3)*55;
  ctx.beginPath();
  ctx.arc(x,y,22,0,Math.PI*2);
  ctx.arc(x+25,y-10,30,0,Math.PI*2);
  ctx.arc(x+55,y,22,0,Math.PI*2);
  ctx.fill();
 }
}

// VẼ RỪNG
function drawForest(){
 for(let t of trees){
  let x=t.x-world.camera*0.65;
  if(x<-100||x>W+100)continue;
  let s=t.size;

  ctx.fillStyle="#795438";
  ctx.fillRect(x-s*.10,H-150,s*.2,100);

  let colors=["#32864a","#267447","#469b53"];
  ctx.fillStyle=colors[t.shade];
  ctx.beginPath();
  ctx.arc(x,H-155,s*.55,0,Math.PI*2);
  ctx.arc(x-s*.28,H-175,s*.35,0,Math.PI*2);
  ctx.arc(x+s*.28,H-175,s*.35,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#8dd36c";
  ctx.fillRect(x-5,H-190,8,8);
 }
}

// MẶT ĐẤT
function drawGround(){
 ctx.fillStyle="#67b84f";
 ctx.fillRect(0,H-65,W,65);

 ctx.fillStyle="#95613d";
 ctx.fillRect(0,H-49,W,49);

 ctx.fillStyle="#8bd46a";
 for(let i=0;i<W/20+2;i++){
  let x=(i*20-world.camera%20);
  ctx.fillRect(x,H-65,12,5);
 }

 // Hoa nhỏ
 for(let i=0;i<40;i++){
  let x=((i*137-world.camera*1.1)%(W+100)+W+100)%(W+100);
  ctx.fillStyle=i%2?"#fff4ad":"#f7a4bd";
  ctx.fillRect(x,H-75-(i%3)*4,5,5);
 }
}

// NHÂN VẬT
function drawPlayer(){
 let x=player.x-world.camera;
 let y=player.y;

 ctx.save();
 ctx.translate(x+16,y+23);
 ctx.scale(player.direction,1);

 // Chân
 ctx.fillStyle="#543b30";
 ctx.fillRect(-12,12,10,11);
 ctx.fillRect(3,12,10,11);

 // Áo
 ctx.fillStyle="#e64f45";
 ctx.fillRect(-13,-7,26,23);

 // Tay
 ctx.fillStyle="#f5c28e";
 ctx.fillRect(-19,-4,7,16);
 ctx.fillRect(12,-4,7,16);

 // Đầu
 ctx.fillStyle="#f5c28e";
 ctx.fillRect(-12,-29,24,24);

 // Tóc
 ctx.fillStyle="#633d28";
 ctx.fillRect(-13,-32,26,9);
 ctx.fillRect(-13,-26,6,10);
 ctx.fillRect(7,-26,6,10);

 // Mắt
 ctx.fillStyle="#252525";
 ctx.fillRect(4,-20,4,5);

 // Khăn choàng
 ctx.fillStyle="#ffe16a";
 ctx.fillRect(-13,-7,26,5);

 // Kiếm
 if(player.attacking>0){
  ctx.fillStyle="#eaf7ff";
  ctx.fillRect(17,-16,30,5);
  ctx.fillStyle="#a66b36";
  ctx.fillRect(14,-20,5,13);
 }

 ctx.restore();
}

// ĐÁ QUÝ
function drawGems(){
 for(let g of gems){
  if(g.taken)continue;
  let x=g.x-world.camera;
  if(x<-20||x>W+20)continue;

  ctx.fillStyle="#62f5ff";
  ctx.beginPath();
  ctx.moveTo(x,g.y-12);
  ctx.lineTo(x+10,g.y);
  ctx.lineTo(x,g.y+12);
  ctx.lineTo(x-10,g.y);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle="#d8ffff";
  ctx.stroke();
 }
}

// QUÁI VẬT
function drawEnemies(){
 for(let e of enemies){
  if(!e.alive)continue;
  let x=e.x-world.camera;
  if(x<-40||x>W+40)continue;

  ctx.fillStyle="#8a56ba";
  ctx.fillRect(x-17,H-100,34,30);

  ctx.fillStyle="#b77cda";
  ctx.fillRect(x-13,H-108,26,12);

  ctx.fillStyle="white";
  ctx.fillRect(x-8,H-102,6,7);
  ctx.fillRect(x+4,H-102,6,7);

  ctx.fillStyle="#333";
  ctx.fillRect(x-6,H-100,3,4);
  ctx.fillRect(x+6,H-100,3,4);
 }
}

// VẼ CẢNH
function render(){
 drawSky();
 drawForest();
 drawGround();
 drawGems();
 drawEnemies();
 drawPlayer();
}// ÂM THANH GAME
let audioCtx=null;
let soundOn=true;

function playSound(freq=440,duration=0.12){
 if(!soundOn)return;
 try{
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
  let osc=audioCtx.createOscillator();
  let gain=audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.frequency.value=freq;
  gain.gain.setValueAtTime(0.08,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+duration);
  osc.start();
  osc.stop(audioCtx.currentTime+duration);
 }catch(e){}
}

// ĐIỀU KHIỂN ĐIỆN THOẠI
function holdButton(id,key){
 const btn=document.getElementById(id);
 btn.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[key]=true;
 });
 ["pointerup","pointercancel","pointerleave"].forEach(event=>{
  btn.addEventListener(event,e=>{
   keys[key]=false;
  });
 });
}

holdButton("left","left");
holdButton("right","right");

document.getElementById("jump").addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(!player.jumping){
  player.vy=-12;
  player.jumping=true;
  playSound(550);
 }
});

document.getElementById("attack").addEventListener("pointerdown",e=>{
 e.preventDefault();
 player.attacking=15;
 playSound(180);
});

// BÀN PHÍM
addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=true;

 if((e.key===" "||e.key==="ArrowUp")&&!player.jumping){
  player.vy=-12;
  player.jumping=true;
  playSound(550);
 }

 if(e.key==="j"||e.key==="Enter"){
  player.attacking=15;
  playSound(180);
 }
});

addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
});

// CẬP NHẬT GAME
let lastTime=0;
let damageCooldown=0;

function update(){
 if(keys.left){
  player.vx=-player.speed;
  player.direction=-1;
 }else if(keys.right){
  player.vx=player.speed;
  player.direction=1;
 }else{
  player.vx*=0.75;
 }

 player.x+=player.vx;
 player.x=Math.max(0,Math.min(world.width-player.width,player.x));

 // Trọng lực
 player.vy+=0.55;
 player.y+=player.vy;

 if(player.y+player.height>=H-65){
  player.y=H-65-player.height;
  player.vy=0;
  player.jumping=false;
 }

 // Camera
 world.camera=player.x-W*0.35;
 world.camera=Math.max(0,Math.min(world.width-W,world.camera));

 // Đá quý
 for(let g of gems){
  if(g.taken)continue;
  if(Math.abs(player.x-g.x)<30&&Math.abs(player.y+20-g.y)<50){
   g.taken=true;
   player.coins++;
   playSound(850);
  }
 }

 // Quái vật
 for(let e of enemies){
  if(!e.alive)continue;

  let distance=player.x-e.x;

  if(Math.abs(distance)<180){
   e.x+=Math.sign(distance)*e.speed;
  }

  if(Math.abs(distance)<35&&player.y+player.height>H-115){
   if(player.attacking>0){
    e.alive=false;
    player.coins+=2;
    playSound(250);
   }else if(damageCooldown<=0){
    player.hp--;
    damageCooldown=70;
    playSound(100);
   }
  }
 }

 if(damageCooldown>0)damageCooldown--;
 if(player.attacking>0)player.attacking--;

 document.getElementById("hp").textContent=player.hp;
 document.getElementById("coins").textContent=player.coins;

 if(player.hp<=0){
  started=false;
  document.getElementById("menu").style.display="flex";
  document.getElementById("controls").style.display="none";
  document.getElementById("hud").style.display="none";
  document.querySelector("#menu h1").innerHTML="GAME OVER";
  document.getElementById("start").textContent="CHƠI LẠI";
 }
}

// VÒNG LẶP GAME
function loop(time=0){
 if(!started)return;
 update();
 render();
 requestAnimationFrame(loop);
}

</script>
</body>
</html>
