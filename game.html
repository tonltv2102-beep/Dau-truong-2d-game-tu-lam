<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>Go to Wonderland - Prototype</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;font-family:system-ui,Arial;color:#fff;touch-action:none}
#game{display:block;width:100vw;height:100dvh;background:#172b35;image-rendering:pixelated}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{position:absolute;background:#101827c9;border:2px solid #718b82;border-radius:9px;padding:7px 10px;box-shadow:0 3px 0 #080e18}
#stats{left:10px;top:10px;min-width:155px}
#stats .small{font-size:11px;color:#d3e4d5}
#hpOuter{height:10px;background:#472b38;border:1px solid #a77b72;border-radius:10px;overflow:hidden;margin:4px 0}
#hp{height:100%;width:100%;background:linear-gradient(90deg,#d94f56,#f18b68)}
#xpOuter{height:5px;background:#263d4b;border-radius:8px;overflow:hidden;margin-top:5px}
#xp{height:100%;width:18%;background:#83d5c2}
#topright{right:10px;top:10px;display:flex;gap:6px;pointer-events:auto}
.uiBtn{background:#263b47;color:#fff;border:1px solid #8aa69a;border-radius:8px;padding:7px 10px;font-weight:700;font-size:12px}
#quest{left:10px;top:95px;font-size:11px;max-width:190px;color:#e9e8c7}
#toast{position:absolute;top:18%;left:50%;transform:translateX(-50%);background:#111c25dd;border:1px solid #a9c6a9;border-radius:8px;padding:8px 12px;font-size:12px;opacity:0;transition:opacity .2s;white-space:nowrap}
#controls{position:fixed;inset:0;pointer-events:none}
.pad{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:10px;pointer-events:auto}
#move{left:16px;align-items:flex-end}
#actions{right:16px;align-items:flex-end}
.ctrl{width:58px;height:58px;border-radius:50%;border:2px solid #d7e6dc88;background:#1b2a32a8;color:#fff;font-size:22px;font-weight:800;display:grid;place-items:center;box-shadow:0 3px 0 #08121a88;user-select:none;-webkit-user-select:none}
.ctrl:active,.ctrl.down{background:#a5d7c455;transform:scale(.96)}
.ctrl.sm{width:48px;height:48px;font-size:17px}
#attack{width:70px;height:70px;font-size:28px;border-color:#f3d79caa}
#skill{border-color:#9bd5e7aa}
#hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:10px;color:#d9e4d2;background:#10182799;padding:4px 8px;border-radius:8px;white-space:nowrap}
#inventory{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,90vw);background:#152431f5;border:2px solid #a8c3a5;border-radius:12px;padding:14px;z-index:5;box-shadow:0 10px 35px #000a}
#inventory h3{margin:0 0 8px;font-size:17px}
.slot{border:1px solid #6d8a80;border-radius:8px;padding:8px;margin:6px 0;background:#203743;font-size:12px}
#inventory .close{float:right}
@media (orientation:portrait){#quest{top:100px}#hint{bottom:148px} .ctrl{width:54px;height:54px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div id="stats" class="panel">
  <div style="display:flex;justify-content:space-between"><b>KIẾM SĨ</b><span id="level">Lv. 1</span></div>
  <div class="small">HP <span id="hpText">100 / 100</span></div><div id="hpOuter"><div id="hp"></div></div>
  <div class="small">EXP</div><div id="xpOuter"><div id="xp"></div></div>
  <div class="small" style="margin-top:4px">🪙 <span id="gold">0</span> vàng</div>
 </div>
 <div id="quest" class="panel">NHIỆM VỤ<br>Hạ 5 Slime trong Rừng Cổ Đại<br><span id="kills">Đã hạ: 0 / 5</span></div>
 <div id="topright"><button class="uiBtn" id="bag">🎒 Túi đồ</button><button class="uiBtn" id="pause">Ⅱ</button></div>
 <div id="toast"></div>
</div>
<div id="controls">
 <div id="move" class="pad"><div class="ctrl" data-key="left">◀</div><div class="ctrl" data-key="right">▶</div></div>
 <div id="actions" class="pad"><div class="ctrl sm" data-key="jump">↑</div><div class="ctrl sm" id="skill">✦</div><div class="ctrl" id="attack">⚔</div></div>
 <div id="hint">Chạm nút để di chuyển • ⚔ tấn công • ✦ lướt chém</div>
</div>
<div id="inventory">
 <button class="uiBtn close" id="closeBag">Đóng</button><h3>🎒 Túi đồ</h3>
 <div class="slot">⚔ Kiếm phiêu lưu <b style="float:right">ATK +5</b><br><span style="color:#a9c6b6">Vũ khí đang trang bị</span></div>
 <div id="items"></div>
 <div class="slot">💡 Mẹo: Hạ quái để nhặt vàng và bình hồi phục.</div>
</div>
<script>
(()=> {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=960,H=540,scale=1, last=0,paused=false, camera=0, toastTimer=0;
function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;W=canvas.width/dpr;H=canvas.height/dpr;ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.max(W/960,H/540);}
addEventListener('resize',resize);resize();
const worldW=3200, floorY=430;
const keys={left:false,right:false,jump:false};
let player={x:110,y:300,vx:0,vy:0,w:30,h:48,face:1,hp:100,maxHp:100,onGround:false,attack:0,skill:0,inv:0,anim:0,exp:0,level:1,gold:0};
let enemies=[],drops=[],particles=[],inventory=[],kills=0,spawnBoss=false,boss=null;
function spawnSlime(x){enemies.push({x,y:floorY-26,w:34,h:26,hp:36,max:36,vx:0,face:-1,hit:0,phase:Math.random()*6,kind:'slime'});}
for(let x=430;x<3000;x+=330)spawnSlime(x);
function say(s){let t=document.getElementById('toast');t.textContent=s;t.style.opacity=1;toastTimer=2.1;}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function drawTree(x,y,par=1){let sx=x-camera*par;if(sx<-120||sx>W+120)return;rect(sx+20,y-100,15,100,'#493b36');rect(sx-8,y-122,70,42,'#244b43');rect(sx+3,y-150,55,42,'#2d6150');rect(sx+15,y-171,34,30,'#39765a');rect(sx+1,y-116,12,8,'#54856a');}
function background(){
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#172c42');g.addColorStop(.55,'#315b58');g.addColorStop(1,'#9a9b67');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // moon / glow
 ctx.globalAlpha=.55;ctx.fillStyle='#d8d6a2';ctx.beginPath();ctx.arc(W*.78,85,30,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 for(let i=0;i<16;i++){let x=i*240-camera*.22;let sx=((x%(W+260))+(W+260))%(W+260)-100;rect(sx,250+(i%3)*16,110,180,'#31504c');rect(sx+25,220+(i%3)*16,75,60,'#365c50');}
 for(let i=0;i<18;i++)drawTree(i*205,420,.55);
 // distant ruins
 for(let i=0;i<7;i++){let x=i*530-camera*.35;let sx=((x%(W+600))+(W+600))%(W+600)-80;rect(sx,300,28,130,'#4d5550');rect(sx-8,290,44,12,'#74745e');rect(sx+7,330,8,30,'#293f42');}
}
function drawGround(){rect(-camera, floorY,worldW,130,'#3b493d');for(let x=0;x<worldW;x+=32){rect(x-camera,floorY,30,7,'#718054');rect(x-camera+8,floorY+13,4,3,'#566448');if(x%96===0)rect(x-camera+25,floorY-8,3,8,'#7e9662');}
 // platforms
 for(const p of [{x:650,y:345,w:160},{x:1110,y:365,w:180},{x:1690,y:330,w:170},{x:2260,y:360,w:190}]){rect(p.x-camera,p.y,p.w,12,'#64764e');rect(p.x-camera,p.y+12,p.w,8,'#463f39');}
}
function drawHero(){
 const x=player.x-camera,y=player.y, f=player.face;
 ctx.save(); if(f<0){ctx.translate(x+player.w,y);ctx.scale(-1,1)}else ctx.translate(x,y);
 let bob=player.onGround?Math.sin(player.anim*10)*1.5:0;
 // shadow
 ctx.globalAlpha=.28;ctx.fillStyle='#081018';ctx.beginPath();ctx.ellipse(15,48,19,5,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 // legs / boots
 rect(6,34+bob,8,12,'#28313a');rect(17,34-bob,8,12,'#28313a');rect(4,44+bob,12,4,'#9b6948');rect(16,44-bob,12,4,'#9b6948');
 // coat
 rect(5,17,21,19,'#354b59');rect(3,23,25,10,'#253744');rect(7,18,5,16,'#b54e48');rect(19,18,4,14,'#9d423f');
 // belt
 rect(5,31,22,4,'#bd9457');rect(17,31,4,4,'#e2c47d');
 // head / hair
 rect(7,4,17,15,'#d69b72');rect(5,2,20,8,'#242632');rect(4,6,6,10,'#242632');rect(20,5,7,7,'#242632');rect(18,11,3,2,'#f2d7ad');
 // scarf
 rect(4,17,19,4,'#c94e48');rect(0,18,8,5,'#e06450');rect(-4,20,8,4,'#c94e48');
 // sword behind/front
 if(player.attack>0||player.skill>0){ctx.strokeStyle='#fff0ba';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(22,22);ctx.lineTo(42,-3);ctx.stroke();ctx.strokeStyle='#9fd7db';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(22,22);ctx.lineTo(42,-3);ctx.stroke();}
 else {rect(25,18,4,22,'#8d6946');rect(25,8,4,18,'#d9e4df');rect(22,17,10,3,'#d6b76d');}
 ctx.restore();
 if(player.inv>0){ctx.strokeStyle='#c8f5dc';ctx.globalAlpha=.55;ctx.beginPath();ctx.arc(x+15,y+23,32,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;}
}
function drawSlime(e){let x=e.x-camera,y=e.y;let wob=Math.sin(e.phase)*2;ctx.fillStyle='#152d31';ctx.fillRect(x+5,y+24,25,4);ctx.fillStyle=e.hit>0?'#fff1c4':'#78bd83';ctx.fillRect(x+2,y+8+wob,e.w-4,e.h-8-wob);ctx.fillStyle='#a6e1a0';ctx.fillRect(x+7,y+5+wob,19,8);ctx.fillStyle='#203b39';ctx.fillRect(x+10,y+14+wob,3,4);ctx.fillRect(x+22,y+14+wob,3,4);ctx.fillStyle='#e9f5d4';ctx.fillRect(x+11,y+14+wob,1,1);ctx.fillRect(x+23,y+14+wob,1,1);if(e.hp<e.max){ctx.fillStyle='#472c36';ctx.fillRect(x,y-5,e.w,3);ctx.fillStyle='#e36b65';ctx.fillRect(x,y-5,e.w*e.hp/e.max,3);}}
function drawBoss(){if(!boss)return;let x=boss.x-camera,y=boss.y;ctx.fillStyle='#18252b';ctx.fillRect(x+8,y+65,64,8);ctx.fillStyle=boss.rage?'#b65b65':'#6d7184';ctx.fillRect(x+12,y+20,56,48);ctx.fillStyle='#454d65';ctx.fillRect(x+6,y+5,68,25);ctx.fillStyle='#d7b46f';ctx.fillRect(x+17,y+13,8,5);ctx.fillRect(x+53,y+13,8,5);ctx.fillStyle='#e8a4a0';ctx.fillRect(x+25,y+34,30,5);ctx.fillStyle='#9da5a4';ctx.fillRect(x+2,y+28,12,35);ctx.fillRect(x+66,y+28,12,35);ctx.fillStyle='#372b3c';ctx.fillRect(x+20,y+64,15,12);ctx.fillRect(x+48,y+64,15,12);ctx.fillStyle='#482a36';ctx.fillRect(x,y-12,82,6);ctx.fillStyle='#e35d68';ctx.fillRect(x,y-12,82*boss.hp/boss.max,6);ctx.fillStyle='#fff';ctx.font='11px system-ui';ctx.fillText(boss.rage?'BOSS - CUỒNG NỘ':'VỆ BINH CỔ ĐẠI',x-8,y-18);}
function update(dt){
 if(paused)return;
 player.anim+=dt*7;player.inv=Math.max(0,player.inv-dt);player.attack=Math.max(0,player.attack-dt);player.skill=Math.max(0,player.skill-dt);
 let move=(keys.right?1:0)-(keys.left?1:0);player.vx=move*190;if(move)player.face=move;
 player.x=Math.max(0,Math.min(worldW-player.w,player.x+player.vx*dt));
 if(keys.jump&&player.onGround){player.vy=-420;player.onGround=false;}
 player.vy+=1000*dt;player.y+=player.vy*dt;player.onGround=false;
 if(player.y+player.h>=floorY){player.y=floorY-player.h;player.vy=0;player.onGround=true;}
 // platforms
 for(const p of [{x:650,y:345,w:160},{x:1110,y:365,w:180},{x:1690,y:330,w:170},{x:2260,y:360,w:190}])if(player.vy>=0&&player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>=p.y&&player.y+player.h-player.vy*dt<=p.y){player.y=p.y-player.h;player.vy=0;player.onGround=true;}
 for(const e of enemies){e.phase+=dt*5;e.hit=Math.max(0,e.hit-dt);let dx=player.x-e.x;if(Math.abs(dx)<260){e.vx=Math.sign(dx)*48;e.x+=e.vx*dt;}if(Math.abs(dx)<35&&player.inv<=0){player.hp-=12;player.inv=.8;updateHud();say('Bạn bị Slime va trúng!');}}
 if(boss){boss.time+=dt;if(boss.hp<=boss.max*.3&&!boss.rage){boss.rage=true;boss.rageTime=60;say('Vệ binh bước vào trạng thái CUỒNG NỘ!');}if(boss.rage){boss.rageTime-=dt;boss.vx=110;}let dx=player.x-boss.x;if(Math.abs(dx)<300)boss.x+=Math.sign(dx)*(boss.rage?100:55)*dt;if(Math.abs(dx)<65&&player.inv<=0){player.hp-=boss.rage?20:14;player.inv=1;updateHud();}}
 for(const d of drops){d.life-=dt;d.y+=Math.sin(performance.now()/150+d.x)*.1;}
 particles=particles.filter(p=>p.life>0);for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt;}
 enemies=enemies.filter(e=>e.hp>0);
 if(player.hp<=0){player.hp=player.maxHp;player.x=Math.max(20,player.x-180);player.y=floorY-player.h;player.gold=Math.max(0,player.gold-5);say('Bạn đã gục ngã! Hồi sinh tại rìa khu rừng.');updateHud();}
 if(kills>=5&&!boss){boss={x:worldW-380,y:floorY-76,hp:260,max:260,rage:false,rageTime:60,time:0};say('Cổng cổ đại mở ra! Vệ binh xuất hiện.');}
 camera=Math.max(0,Math.min(worldW-W/scale,player.x-W/scale*.38));
}
function attack(skill=false){
 if(paused)return;
 if(skill){if(player.skill>0)return;player.skill=1.1;player.attack=.45;player.x=Math.min(worldW-player.w,player.x+player.face*100);}
 else {if(player.attack>.18)return;player.attack=.32;}
 let reach=skill?125:75;
 for(const e of enemies){let dx=e.x-player.x;if(Math.abs(dx)<reach&&Math.sign(dx||1)===player.face){e.hp-=skill?35:20;e.hit=.15;for(let i=0;i<7;i++)particles.push({x:e.x+15,y:e.y+10,vx:(Math.random()-.5)*100,vy:-Math.random()*130,life:.35});if(e.hp<=0){kills++;player.gold+=4;player.exp+=12;if(Math.random()<.35){inventory.push('🧪 Bình hồi phục');drops.push({x:e.x,y:e.y-10,life:8});}if(player.exp>=100){player.exp-=100;player.level++;player.maxHp+=10;player.hp=player.maxHp;say('Lên cấp! HP tối đa +10');}updateHud();}}
 }
 if(boss&&Math.abs(boss.x-player.x)<reach+30&&Math.sign(boss.x-player.x||1)===player.face){boss.hp-=skill?28:16;if(boss.hp<=0){boss=null;say('Chiến thắng! Bạn đã đánh bại Vệ binh cổ đại!');player.gold+=100;}}
}
function updateHud(){document.getElementById('hp').style.width=Math.max(0,player.hp/player.maxHp*100)+'%';document.getElementById('hpText').textContent=Math.max(0,Math.ceil(player.hp))+' / '+player.maxHp;document.getElementById('gold').textContent=player.gold;document.getElementById('level').textContent='Lv. '+player.level;document.getElementById('xp').style.width=player.exp+'%';document.getElementById('kills').textContent='Đã hạ: '+kills+' / 5';document.getElementById('items').innerHTML=inventory.length?inventory.map((v,i)=>'<div class="slot">'+v+' <button class="uiBtn" onclick="usePotion('+i+')">Dùng</button></div>').join(''):'<div class="slot">Chưa có vật phẩm. Hãy săn Slime!</div>';}
window.usePotion=i=>{if(inventory[i]==='🧪 Bình hồi phục'){player.hp=Math.min(player.maxHp,player.hp+40);inventory.splice(i,1);updateHud();say('Đã hồi 40 HP!');}};
function render(){
 ctx.clearRect(0,0,W,H);ctx.save();ctx.scale(W/960,H/540);
 background();drawGround();
 // flowers / mushrooms
 for(let i=0;i<35;i++){let x=i*95-camera;if(x>-20&&x<980){rect(x,floorY-5,3,5,'#d4c77a');rect(x+3,floorY-4,3,3,'#b96b79');}}
 for(const e of enemies)drawSlime(e);drawBoss();drawHero();
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.35);rect(p.x-camera,p.y,4,4,'#f6d99b');}ctx.globalAlpha=1;
 // area title
 if(player.x<700){ctx.fillStyle='#e2e5c7';ctx.font='bold 17px system-ui';ctx.fillText('RỪNG CỔ ĐẠI',360-camera*.12,70);ctx.font='11px system-ui';ctx.fillText('Những sinh vật cổ xưa đang thức tỉnh...',330-camera*.12,90);}
 ctx.restore();
}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);render();if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)document.getElementById('toast').style.opacity=0;}requestAnimationFrame(loop);}
requestAnimationFrame(loop);
function bind(el,down,up){el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('down');down();});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,e=>{el.classList.remove('down');up&&up();}));}
document.querySelectorAll('[data-key]').forEach(el=>{let k=el.dataset.key;bind(el,()=>keys[k]=true,()=>keys[k]=false);});
bind(document.getElementById('attack'),()=>attack(false));
bind(document.getElementById('skill'),()=>attack(true));
document.getElementById('bag').onclick=()=>{updateHud();document.getElementById('inventory').style.display='block';};
document.getElementById('closeBag').onclick=()=>document.getElementById('inventory').style.display='none';
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▶':'Ⅱ';say(paused?'Đã tạm dừng':'Tiếp tục cuộc phiêu lưu');};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key===' '||e.key==='ArrowUp'||e.key==='w')keys.jump=true;if(e.key==='j')attack();if(e.key==='k')attack(true);});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key===' '||e.key==='ArrowUp'||e.key==='w')keys.jump=false;});
updateHud();say('Chào mừng đến Rừng Cổ Đại! Hạ 5 Slime để mở cổng boss.');
})();
</script>
</body></html>
