
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đấu Trường Bàn Cờ</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#172333;color:white;
 font-family:Arial;text-align:center;padding:12px;
}
h2{margin:8px}
.info{font-size:17px;margin:12px}
#board{
 display:grid;
 grid-template-columns:repeat(9,1fr);
 gap:3px;
 width:min(94vw,480px);
 aspect-ratio:1;
 margin:15px auto;
 background:#34495e;padding:5px;border-radius:10px;
}
.cell{
 background:#e8d5ae;
 border:1px solid #b79d70;
 border-radius:4px;
 position:relative;
 display:flex;align-items:center;justify-content:center;
 min-width:0;
}
.cell.selected{background:#76d7c4}
.cell.move{background:#b9e6a0}
.piece{
 width:72%;height:72%;border-radius:50%;
 border:3px solid #333;
 box-shadow:0 2px 5px #3338;
}
.white{background:#fff}
.black{background:#202020;border-color:#aaa}
.wall{
 position:absolute;
 background:#9b542b;
 z-index:3;
 border:2px solid #633719;
}
.wall.h{height:12px;width:100%;top:-7px}
.wall.v{width:12px;height:100%;left:-7px}
button{
 padding:11px 18px;margin:5px;
 border:0;border-radius:8px;
 font-size:16px;font-weight:bold;
}
</style>
</head>
<body>
<h2>⚔️ ĐẤU TRƯỜNG BÀN CỜ</h2>
<div class="info" id="turn">Lượt: Trắng</div>
<div class="info" id="status">Chọn quân cờ để di chuyển</div>
<div id="board"></div>
<button onclick="mode='move';update()">Di chuyển</button>
<button onclick="mode='wall';update()">Đặt gạch</button>
<button onclick="reset()">Chơi lại</button>
<script>
const N=9;
let pieces={white:{x:4,y:8},black:{x:4,y:0}};
let walls=[];
let turn='white',mode='move',selected=null;
let board=document.getElementById('board');

function blocked(x,y,nx,ny){
 if(nx<0||ny<0||nx>=N||ny>=N)return true;
 if(pieces.white.x===nx&&pieces.white.y===ny)return true;
 if(pieces.black.x===nx&&pieces.black.y===ny)return true;
 return false;
}
function update(){
 board.innerHTML='';
 for(let y=0;y<N;y++){
  for(let x=0;x<N;x++){
   let c=document.createElement('div');
   c.className='cell';
   if(selected&&selected.x===x&&selected.y===y)c.classList.add('selected');
   let p=Object.entries(pieces).find(([k,v])=>v.x===x&&v.y===y);
   if(p){
    let el=document.createElement('div');
    el.className='piece '+(p[0]==='white'?'white':'black');
    c.appendChild(el);
   }
   if(walls.some(w=>w.x===x&&w.y===y)){
    let el=document.createElement('div');
    el.className='wall '+(walls.find(w=>w.x===x&&w.y===y).dir);
    c.appendChild(el);
   }
   c.onclick=()=>clickCell(x,y);
   board.appendChild(c);
  }
 }
 document.getElementById('turn').textContent='Lượt: '+(turn==='white'?'Trắng':'Đen');
}
function clickCell(x,y){
 let own=pieces[turn];
 if(mode==='move'){
  if(!selected){
   if(own.x===x&&own.y===y){
    selected={x,y};
    document.getElementById('status').textContent='Chọn ô kế tiếp';
   }
  }else{
   let dx=Math.abs(x-selected.x),dy=Math.abs(y-selected.y);
   if(dx+dy===1&&!blocked(selected.x,selected.y,x,y)){
    own.x=x;own.y=y;
    next();
   }
   selected=null;
  }
 }else{
  if(!walls.some(w=>w.x===x&&w.y===y)){
   walls.push({x,y,dir:'h'});
   next();
  }
 }
 update();
}
function next(){
 turn=turn==='white'?'black':'white';
 selected=null;
 mode='move';
 document.getElementById('status').textContent='Đến lượt '+(turn==='white'?'Trắng':'Đen');
}
function reset(){
 pieces={white:{x:4,y:8},black:{x:4,y:0}};
 walls=[];turn='white';mode='move';selected=null;
 document.getElementById('status').textContent='Chọn quân cờ để di chuyển';
 update();
}
update();
</script>
</body>
</html>
