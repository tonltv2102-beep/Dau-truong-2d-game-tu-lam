
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiêu Diệt Quái Vật - Hoang Studio</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#080b18;color:white;
  font-family:Arial;text-align:center;
}
h2{color:#43caff}
canvas{
  display:block;margin:15px auto;
  width:94%;max-width:600px;
  background:#151d32;border:3px solid #36c8ff;
  border-radius:12px;touch-action:none;
}
.info{display:flex;justify-content:center;gap:25px}
button{
  background:#673cff;color:white;border:0;
  padding:15px 22px;border-radius:12px;
  font-size:18px;margin:5px;touch-action:none;
}
button:active{background:#36c8ff}
.controls{margin:15px}
#message{color:#ffd166;font-size:20px}
</style>
</head>
<body>

<h2>⚔️ HOANG STUDIO ⚔️</h2>
<h3>TIÊU DIỆT QUÁI VẬT</h3>

<div class="info">
  <span>❤️ Máu: <b id="hp">100</b></span>
  <span>⭐ Điểm: <b id="score">0</b></span>
</div>

<canvas id="game" width="600" height="350"></canvas>

<p id="message">Hãy tiêu diệt quái vật!</p>

<div class="controls">
  <button id="left">⬅️</button>
  <button id="attack">⚔️ ĐÁNH</button>
  <button id="right">➡️</button>
</div>
<button onclick="restart()">🔄 Chơi lại</button>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const hpText=document.getElementById("hp");
const scoreText=document.getElementById("score");
const message=document.getElementById("message");

let player, monsters, score, hp, gameOver;
let left=false,right=false,attacking=false;
let attackTime=0,spawnTime=0,lastTime=0;

function restart(){
  player={x:280,y:275,size:22};
  monsters=[];
  score=0;hp=100;gameOver=false;
  left=false;right=false;attacking=false;
  message.textContent="Hãy tiêu diệt quái vật!";
  hpText.textContent=hp;
  scoreText.textContent=score;
}
function monster(){
  monsters.push({
    x:Math.random()*550+25,
    y:Math.random()*100+20,
    size:17,
    speed:0.5+Math.random()*0.5
  });
}
function drawPlayer(){
  ctx.fillStyle="#36c8ff";
  ctx.fillRect(player.x-15,player.y-20,30,40);
  ctx.fillStyle="white";
  ctx.fillRect(player.x-8,player.y-12,5,5);
  ctx.fillRect(player.x+4,player.y-12,5,5);
  if(attacking){
    ctx.strokeStyle="#ffe066";
    ctx.lineWidth=5;
    ctx.beginPath();
    ctx.arc(player.x,player.y,48,-1.1,1.1);
    ctx.stroke();
  }
}
function drawMonster(m){
  ctx.fillStyle="#ff4757";
  ctx.beginPath();
  ctx.arc(m.x,m.y,m.size,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="white";
  ctx.fillRect(m.x-8,m.y-5,5,5);
  ctx.fillRect(m.x+4,m.y-5,5,5);
}
function update(dt){
  if(gameOver)return;

  if(left)player.x-=0.22*dt;
  if(right)player.x+=0.22*dt;
  player.x=Math.max(20,Math.min(580,player.x));

  spawnTime+=dt;
  if(spawnTime>1300){
    monster();spawnTime=0;
  }

  if(attackTime>0){
    attackTime-=dt;
    attacking=true;
  }else attacking=false;

  monsters.forEach((m,i)=>{
    let dx=player.x-m.x;
    let dy=player.y-m.y;
    let d=Math.hypot(dx,dy)||1;
    m.x+=dx/d*m.speed*dt/8;
    m.y+=dy/d*m.speed*dt/8;

    if(attacking&&d<65){
      monsters.splice(i,1);
      score+=10;
      scoreText.textContent=score;
      return;
    }
    if(d<30){
      hp-=0.15*dt/16;
      hp=Math.max(0,hp);
      hpText.textContent=Math.ceil(hp);
      if(hp<=0){
        gameOver=true;
        message.textContent="Bạn đã thua! Hãy chơi lại!";
      }
    }
  });
}
function draw(){
  ctx.clearRect(0,0,600,350);
  ctx.fillStyle="#202c47";
  for(let x=0;x<600;x+=40){
    for(let y=0;y<350;y+=40){
      ctx.fillRect(x,y,1,1);
    }
  }
  drawPlayer();
  monsters.forEach(drawMonster);
  if(gameOver){
    ctx.fillStyle="white";
    ctx.font="bold 35px Arial";
    ctx.textAlign="center";
    ctx.fillText("GAME OVER",300,170);
  }
}
function loop(time){
  let dt=Math.min(time-lastTime,40);
  lastTime=time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
function hold(id,callback){
  const b=document.getElementById(id);
  b.addEventListener("pointerdown",e=>{
    e.preventDefault();callback(true);
  });
  ["pointerup","pointercancel","pointerleave"].forEach(event=>{
    b.addEventListener(event,()=>callback(false));
  });
}
hold("left",v=>left=v);
hold("right",v=>right=v);
document.getElementById("attack").addEventListener("pointerdown",e=>{
  e.preventDefault();attackTime=300;
});
restart();
requestAnimationFrame(loop);
</script>
</body>
</html>
