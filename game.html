
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Go to Wonderland</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090910;color:#eee;font-family:Arial;overflow:hidden;touch-action:none}
#game{display:block;width:100vw;height:100dvh;background:#111;image-rendering:pixelated}
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none}
.panel{background:#10101ddd;border:1px solid #75617b;border-radius:7px;padding:7px 10px;font-size:12px}
.bar{width:130px;height:10px;background:#333;margin-top:4px;border:1px solid #777}
#hp{height:100%;width:100%;background:#b52b42}
#xp{height:100%;width:0;background:#d6b34b}
#menu{position:fixed;inset:0;background:#080810ee;display:flex;align-items:center;justify-content:center;z-index:5}
#menuBox{width:min(92vw,520px);padding:20px;text-align:center;background:#171522;border:2px solid #69546e;border-radius:12px}
h1{color:#d9b5e8;letter-spacing:2px;font-size:26px}
.classes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:15px 0}
.classBtn,button{background:#292438;color:white;border:1px solid #806b8b;border-radius:7px;padding:12px;font-weight:bold}
.classBtn.selected{border:2px solid #e3bd65;background:#49364d}
#start{background:#765039;width:100%;font-size:17px}
#controls{position:fixed;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.pad,.actions{display:flex;gap:8px;pointer-events:auto}
.control{width:54px;height:54px;border-radius:50%;background:#252334dd;border:2px solid #8d8196;color:white;font-size:20px}
.actions .control{width:58px;height:58px}
#message{position:fixed;top:75px;left:50%;transform:translateX(-50%);background:#171522dd;padding:8px 14px;border-radius:8px;display:none}
#inventory{position:fixed;right:10px;top:62px;width:190px;background:#171522ee;border:1px solid #806b8b;border-radius:8px;padding:10px;display:none;font-size:12px}
#inventory button{padding:5px;margin-top:5px}
@media(orientation:portrait){
 #rotate{display:flex}
}
#rotate{display:none;position:fixed;inset:0;background:#080810ee;z-index:9;align-items:center;justify-content:center;text-align:center;padding:30px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate">Hãy xoay điện thoại sang ngang để chơi nhé!</div>

<div id="hud">
 <div class="panel">
  <b id="heroName">Kiếm sĩ</b> · Cấp <span id="level">1</span>
  <div class="bar"><div id="hp"></div></div>
  <small>HP: <span id="hpText">100/100</span></small>
  <div class="bar"><div id="xp"></div></div>
  <small>EXP: <span id="xpText">0/100</span></small>
 </div>
 <div class="panel">Vàng: <span id="gold">0</span><br>Kiếm: <span id="swordName">Kiếm gỗ</span><br>Giáp: <span id="armorName">Áo vải</span></div>
</div>

<div id="menu">
 <div id="menuBox">
  <h1>GO TO WONDERLAND</h1>
  <p>Chọn lớp nhân vật</p>
  <div class="classes">
   <button class="classBtn selected" data-class="knight">⚔ Kiếm sĩ</button>
   <button class="classBtn" data-class="mage">✦ Pháp sư</button>
   <button class="classBtn" data-class="archer">➶ Cung thủ</button>
   <button class="classBtn" data-class="rogue">◆ Sát thủ</button>
   <button class="classBtn" data-class="paladin">✧ Hiệp sĩ ánh sáng</button>
  </div>
  <button id="start">BẮT ĐẦU CUỘC PHIÊU LƯU</button>
 </div>
</div>

<div id="message"></div>
<div id="inventory">
 <b>TÚI ĐỒ</b>
 <div id="items">Chưa có vật phẩm</div>
 <button id="closeBag">Đóng</button>
</div>

<div id="controls">
 <div class="pad">
  <button class="control" id="left">◀</button>
  <button class="control" id="right">▶</button>
 </div>
 <div class="actions">
  <button class="control" id="jump">↑</button>
  <button class="control" id="attack">⚔</button>
  <button class="control" id="skill">✦</button>
  <button class="control" id="bag">▣</button>
 </div>
</div>

<script>

const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,scale=1;
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener("resize",resize);resize();

const classes={
 knight:{name:"Kiếm sĩ",hp:120,damage:18,speed:3.2,color:"#b9c6d4"},
 mage:{name:"Pháp sư",hp:85,damage:25,speed:3.1,color:"#a78bfa"},
 archer:{name:"Cung thủ",hp:95,damage:20,speed:3.7,color:"#8dbd79"},
 rogue:{name:"Sát thủ",hp:90,damage:23,speed:4.2,color:"#9d879f"},
 paladin:{name:"Hiệp sĩ ánh sáng",hp:140,damage:16,speed:2.9,color:"#e3c879"}
};
let chosen="knight",started=false,keys={},camera=0,worldWidth=4200;
let player={x:100,y:0,vx:0,vy:0,w:30,h:48,hp:120,maxHp:120,damage:18,speed:3.2,level:1,xp:0,gold:0,face:1,onGround:false,attack:0,skill:0,invul:0};
let enemies=[],drops=[],particles=[],boss=null,inventory=[],time=0,toastTimer=0;
let sword={name:"Kiếm gỗ",level:1,damage:0};
let armor={name:"Áo vải",level:1,def:0};
const tiers=[
 {name:"Thường",chance:50,color:"#ddd"},
 {name:"Tốt",chance:25,color:"#75d68b"},
 {name:"Hiếm",chance:15,color:"#55aaff"},
 {name:"Sử thi",chance:7,color:"#c17aff"},
 {name:"Huyền thoại",chance:3,color:"#ffbd45"}
];
function rand(a,b){return Math.random()*(b-a)+a}
function toast(s){let m=document.getElementById("message");m.textContent=s;m.style.display="block";toastTimer=2.5}
function updateHUD(){
 document.getElementById("heroName").textContent=classes[chosen].name;
 document.getElementById("level").textContent=player.level;
 document.getElementById("hp").style.width=(player.hp/player.maxHp*100)+"%";
 document.getElementById("hpText").textContent=Math.ceil(player.hp)+"/"+player.maxHp;
 document.getElementById("xp").style.width=(player.xp/100*100)+"%";
 document.getElementById("xpText").textContent=player.xp+"/100";
 document.getElementById("gold").textContent=player.gold;
 document.getElementById("swordName").textContent=sword.name;
 document.getElementById("armorName").textContent=armor.name;
}
function makeEnemy(x,type="goblin"){
 let data={
  slime:{hp:35,damage:8,speed:1.1,w:30,h:25,color:"#6d9c69",xp:12},
  goblin:{hp:65,damage:12,speed:1.5,w:30,h:42,color:"#8c8b59",xp:20},
  skeleton:{hp:95,damage:15,speed:1.2,w:32,h:46,color:"#c4c0b4",xp:30},
  wolf:{hp:75,damage:18,speed:2.3,w:43,h:30,color:"#77727c",xp:28}
 }[type];
 enemies.push({x,y:H-95,w:data.w,h:data.h,hp:data.hp,maxHp:data.hp,damage:data.damage,speed:data.speed,color:data.color,type, xp:data.xp,hit:0,face:-1});
}
function createWorld(){
 enemies=[];drops=[];particles=[];
 for(let x=420;x<worldWidth-300;x+=rand(260,420)){
  let types=["slime","goblin","skeleton","wolf"];
  makeEnemy(x,types[Math.floor(rand(0,types.length))]);
 }
 boss={x:worldWidth-220,y:H-160,w:100,h:110,hp:player.maxHp*2,maxHp:player.maxHp*2,damage:player.damage*.8,speed:player.speed*.85,active:false,enraged:false,enrageTime:0,face:-1};
}
function addXP(n){
 player.xp+=n;
 while(player.xp>=100){player.xp-=100;player.level++;player.maxHp+=12;player.hp=player.maxHp;player.damage+=3;toast("LÊN CẤP "+player.level+"!");}
 updateHUD();
}
function addDrop(x,y,item){
 drops.push({x,y,item,life:40});
}
function rollTier(){
 let r=Math.random()*100,total=0;
 for(const t of tiers){total+=t.chance;if(r<total)return t;}
 return tiers[0];
}
function dropLoot(e){
 let tier=rollTier();
 let item;
 if(Math.random()<.55){
  item={type:"sword",name:"Kiếm "+tier.name,tier:tier.name,color:tier.color,damage:[4,7,11,16,23][tiers.indexOf(tier)]};
 }else{
  item={type:"armor",name:"Giáp "+tier.name,tier:tier.name,color:tier.color,def:[1,2,4,7,11][tiers.indexOf(tier)]};
 }
 addDrop(e.x,e.y,item);
 if(Math.random()<.35)addDrop(e.x+18,e.y,{type:"potion",name:"Thuốc hồi máu",color:"#ef5264",heal:35});
 if(Math.random()<.3)addDrop(e.x+30,e.y,{type:"gold",name:"Vàng",color:"#f4d05e",amount:Math.floor(rand(3,12))});
}
function defeatEnemy(e){
 enemies=enemies.filter(v=>v!==e);
 addXP(e.xp);dropLoot(e);
 for(let i=0;i<8;i++)particles.push({x:e.x+rand(0,e.w),y:e.y+rand(0,e.h),vx:rand(-2,2),vy:rand(-3,1),life:25,color:e.color});
}
function attack(){
 if(player.attack>0)return;
 player.attack=.25;
 for(const e of enemies){
  let dx=e.x-player.x;
  if(Math.abs(dx)<65&&Math.sign(dx)===player.face){e.hp-=player.damage+sword.damage;e.hit=.18;if(e.hp<=0)defeatEnemy(e);}
 }
 if(boss&&boss.active&&Math.abs(boss.x-player.x)<100){
  boss.hp-=player.damage+sword.damage;
  if(boss.hp<=boss.maxHp*.3&&!boss.enraged){boss.enraged=true;boss.enrageTime=60;toast("BOSS CUỒNG NỘ!");}
  if(boss.hp<=0){boss.hp=0;toast("BẠN ĐÃ ĐÁNH BẠI BOSS!");boss.active=false;boss.defeated=true;bossLoot();}
 }
}
function bossLoot(){
 let pieces=["Mảnh mũ Rồng Hắc Ám","Mảnh áo Rồng Hắc Ám","Mảnh găng Rồng Hắc Ám","Mảnh giày Rồng Hắc Ám"];
 for(let i=0;i<pieces.length;i++){
  if(Math.random()<[.05,.03,.05,.05][i])addDrop(boss.x+i*15,boss.y,{type:"piece",name:pieces[i],color:"#dc5967"});
 }
 addDrop(boss.x,boss.y,{type:"gold",name:"Vàng Boss",amount:100,color:"#ffcf56"});
}
function useSkill(){
 if(player.skill>0)return;
 player.skill=5;
 for(const e of [...enemies]){
  if(Math.abs(e.x-player.x)<150){e.hp-=player.damage*2;if(e.hp<=0)defeatEnemy(e);}
 }
 toast("KỸ NĂNG!");
}
function useItem(item){
 if(item.type==="potion"){player.hp=Math.min(player.maxHp,player.hp+item.heal);toast("Đã hồi máu");}
 if(item.type==="sword"){sword=item;toast("Đã trang bị "+item.name);}
 if(item.type==="armor"){armor=item;toast("Đã mặc "+item.name);}
}
function pickup(){
 for(const d of [...drops]){
  if(Math.abs(d.x-player.x)<42&&Math.abs(d.y-player.y)<60){
   if(d.item.type==="gold")player.gold+=d.item.amount;
   else if(d.item.type==="potion"){inventory.push(d.item);}
   else inventory.push(d.item);
   drops=drops.filter(v=>v!==d);toast("Nhặt được: "+d.item.name);
  }
 }
 updateHUD();
}

function drawPixel(x,y,w,h,color){
 ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),w,h);
}
function drawBackground(){
 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#10101e");g.addColorStop(1,"#28202b");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // Mặt trăng
 ctx.fillStyle="#c4b5cf";ctx.beginPath();ctx.arc(W-100,100,35,0,Math.PI*2);ctx.fill();
 // Núi xa
 ctx.fillStyle="#211e31";
 for(let i=0;i<8;i++){
  let x=i*180-camera*.25;
  ctx.beginPath();ctx.moveTo(x,H-90);ctx.lineTo(x+100,H-310);ctx.lineTo(x+220,H-90);ctx.fill();
 }
 // Cây tối
 for(let i=0;i<18;i++){
  let x=((i*270-camera*.55)%2200+2200)%2200;
  drawPixel(x,H-190,15,110,"#171a24");
  drawPixel(x-40,H-210,95,65,"#202b2b");
  drawPixel(x-25,H-245,65,60,"#28332f");
 }
 drawPixel(0,H-65,W,65,"#29252b");
 drawPixel(0,H-65,W,5,"#625044");
}
function drawHero(){
 let x=player.x-camera,y=player.y;
 // bóng
 ctx.fillStyle="#09090c88";ctx.beginPath();ctx.ellipse(x+15,H-63,20,5,0,0,Math.PI*2);ctx.fill();
 // chân
 drawPixel(x+5,y+34,8,14,"#39313b");drawPixel(x+18,y+34,8,14,"#39313b");
 // áo giáp
 drawPixel(x+4,y+12,22,25,classes[chosen].color);
 drawPixel(x+8,y+3,16,12,"#d2b7a0");
 drawPixel(x+10,y+7,3,3,"#211c26");
 // mũ và vũ khí
 drawPixel(x+6,y,19,5,"#65616e");
 drawPixel(x+(player.face===1?25:-9),y+14,7,22,"#a9a1b2");
 if(player.attack>0){
  ctx.strokeStyle="#e8d7ff";ctx.lineWidth=5;ctx.beginPath();
  ctx.moveTo(x+15,y+24);ctx.lineTo(x+15+player.face*55,y-8);ctx.stroke();
 }
}
function drawEnemy(e){
 let x=e.x-camera;
 drawPixel(x,e.y,e.w,e.h,e.color);
 drawPixel(x+5,e.y+7,6,5,"#f3d8a8");
 drawPixel(x+e.w-11,e.y+7,6,5,"#f3d8a8");
 ctx.fillStyle="#08080c";ctx.fillRect(x,e.y-9,e.w,4);
 ctx.fillStyle="#d34b52";ctx.fillRect(x,e.y-9,e.w*Math.max(0,e.hp/e.maxHp),4);
}
function drawBoss(){
 if(!boss||boss.defeated)return;
 let x=boss.x-camera;
 if(x<-150||x>W+150)return;
 drawPixel(x,boss.y,boss.w,boss.h,boss.enraged?"#9c293d":"#4c3547");
 drawPixel(x+18,boss.y+18,18,12,"#f4c35b");
 drawPixel(x+65,boss.y+18,18,12,"#f4c35b");
 drawPixel(x+20,boss.y-15,60,15,"#352638");
 ctx.fillStyle="#08080c";ctx.fillRect(W/2-120,25,240,12);
 ctx.fillStyle=boss.enraged?"#e43c50":"#a23b52";
 ctx.fillRect(W/2-120,25,240*Math.max(0,boss.hp/boss.maxHp),12);
 ctx.fillStyle="white";ctx.font="12px Arial";ctx.textAlign="center";
 ctx.fillText(boss.enraged?"BOSS CUỒNG NỘ":"BOSS RỒNG HẮC ÁM",W/2,20);
}
function drawDrops(){
 for(const d of drops){
  drawPixel(d.x-camera,d.y,13,13,d.item.color||"#fff");
 }
}
function drawParticles(){
 for(const p of particles){drawPixel(p.x-camera,p.y,4,4,p.color);}
}
function update(dt){
 if(!started)return;
 time+=dt;
 if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)document.getElementById("message").style.display="none";}
 player.attack=Math.max(0,player.attack-dt);
 player.skill=Math.max(0,player.skill-dt);
 player.invul=Math.max(0,player.invul-dt);
 let move=(keys.right?1:0)-(keys.left?1:0);
 player.vx=move*player.speed;
 if(move)player.face=move;
 player.x=Math.max(0,Math.min(worldWidth-player.w,player.x+player.vx));
 player.vy+=.55;
 player.y+=player.vy;
 let ground=H-110;
 if(player.y+player.h>=ground){player.y=ground-player.h;player.vy=0;player.onGround=true;}
 else player.onGround=false;
 for(const e of enemies){
  let dx=player.x-e.x;
  if(Math.abs(dx)<240){
   e.x+=Math.sign(dx)*e.speed;
   e.face=Math.sign(dx);
  }
  if(Math.abs(dx)<35&&player.invul<=0){
   player.hp-=Math.max(1,e.damage-armor.def);
   player.invul=.7;
   if(player.hp<=0){player.hp=0;toast("Bạn đã gục ngã! Tải lại để chơi lại.");started=false;}
  }
 }
 if(boss&&!boss.defeated){
  if(player.x>worldWidth-500)boss.active=true;
  if(boss.active){
   let ratio=boss.enraged?1:.85;
   let dx=player.x-boss.x;
   boss.x+=Math.sign(dx)*player.speed*ratio*.35;
   if(boss.enraged){
    boss.enrageTime-=dt;
    if(boss.enrageTime<=0){
     boss.enraged=false;
     boss.damage=player.damage*.8;
     boss.speed=player.speed*.85;
     toast("Boss đã hết cuồng nộ!");
    }
   }
   if(Math.abs(dx)<65&&player.invul<=0){
    player.hp-=Math.max(1,boss.damage-armor.def);
    player.invul=.8;
    if(player.hp<=0){player.hp=0;started=false;toast("Bạn đã gục ngã!");}
   }
  }
 }
 for(const d of drops)d.life-=dt;
 drops=drops.filter(d=>d.life>0);
 for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.life--;}
 particles=particles.filter(p=>p.life>0);
 camera=Math.max(0,Math.min(worldWidth-W,player.x-W*.4));
 updateHUD();
}
function render(){
 drawBackground();
 for(const e of enemies)drawEnemy(e);
 drawDrops();drawBoss();drawHero();drawParticles();
}
function loop(){
 let now=performance.now(),dt=Math.min(.04,(now-(loop.last||now))/1000);loop.last=now;
 update(dt);render();requestAnimationFrame(loop);
}
document.querySelectorAll(".classBtn").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".classBtn").forEach(v=>v.classList.remove("selected"));
 b.classList.add("selected");chosen=b.dataset.class;
});
document.getElementById("start").onclick=()=>{
 let c=classes[chosen];
 player.maxHp=c.hp;player.hp=c.hp;player.damage=c.damage;player.speed=c.speed;
 player.x=100;player.y=H-170;player.level=1;player.xp=0;player.gold=0;
 sword={name:"Kiếm gỗ",level:1,damage:0};armor={name:"Áo vải",level:1,def:0};
 inventory=[];started=true;
 document.getElementById("menu").style.display="none";
 createWorld();updateHUD();toast("Chào mừng đến Wonderland!");
};
function bindHold(id,key){
 let el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{e.preventDefault();keys[key]=true;});
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>el.addEventListener(ev,()=>keys[key]=false));
}
bindHold("left","left");bindHold("right","right");
document.getElementById("jump").onclick=()=>{if(player.onGround){player.vy=-11;player.onGround=false;}};
document.getElementById("attack").onclick=attack;
document.getElementById("skill").onclick=useSkill;
canvas.addEventListener("pointerdown",()=>{if(started)pickup();});
document.getElementById("bag").onclick=()=>{
 let box=document.getElementById("inventory");
 box.style.display=box.style.display==="block"?"none":"block";
 document.getElementById("items").innerHTML=inventory.length?inventory.map((it,i)=>
 `<div style="color:${it.color||"white"}">${it.name} <button onclick="equipItem(${i})">Dùng</button></div>`
 ).join(""):"Chưa có vật phẩm";
};
window.equipItem=i=>{
 let item=inventory[i];if(!item)return;
 if(item.type==="sword"){sword=item;}
 else if(item.type==="armor"){armor=item;}
 else if(item.type==="potion"){useItem(item);inventory.splice(i,1);}
 else if(item.type==="piece"){toast("Đã giữ "+item.name);}
 updateHUD();
};
document.getElementById("closeBag").onclick=()=>document.getElementById("inventory").style.display="none";
addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
 if(e.key===" "&&player.onGround){player.vy=-11;player.onGround=false;}
 if(e.key==="j")attack();
 if(e.key==="k")useSkill();
});
addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
});
updateHUD();requestAnimationFrame(loop);
</script>
</body>
</html>
