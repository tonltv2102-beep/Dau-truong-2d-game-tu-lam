<script>
// PHẦN 2: THẾ GIỚI VÀ NHÂN VẬT

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W, H, ground, camera = 0;
let gameStarted = false;
let time = 0;

const worldWidth = 5000;

function resizeGame() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth;
  H = innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ground = H * 0.79;
}

addEventListener("resize",resizeGame);
resizeGame();

const hero = {
  x: 150,
  y: 0,
  vx: 0,
  vy: 0,
  width: 35,
  height: 60,
  direction: 1,
  speed: 250,
  onGround: false,
  attacking: 0,
  jumping: false,
  moving: false,
  frame: 0
};

hero.y = ground - hero.height;

const particles = [];

function pixel(x,y,w,h,color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x),Math.round(y),w,h);
}

function drawSky() {
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#111c36");
  sky.addColorStop(.45,"#344d68");
  sky.addColorStop(.78,"#b17c69");
  sky.addColorStop(1,"#263b3b");

  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);

  // Mặt trăng
  ctx.fillStyle="#f5e4ba";
  ctx.beginPath();
  ctx.arc(W*.79,H*.19,25,0,Math.PI*2);
  ctx.fill();

  // Ánh sáng mặt trăng
  const glow=ctx.createRadialGradient(
    W*.79,H*.19,10,
    W*.79,H*.19,130
  );
  glow.addColorStop(0,"#ffe6b044");
  glow.addColorStop(1,"#ffe6b000");

  ctx.fillStyle=glow;
  ctx.fillRect(W*.79-130,H*.19-130,260,260);

  // Sao
  for(let i=0;i<65;i++){
    let x=(i*173)%W;
    let y=(i*83)%(H*.45);

    ctx.globalAlpha=.3+Math.sin(time*2+i)*.2;
    pixel(x,y,2,2,"#e8f6ed");
  }

  ctx.globalAlpha=1;
}

function drawMountains() {
  for(let layer=0;layer<3;layer++){
    ctx.beginPath();
    ctx.moveTo(0,ground);

    for(let x=0;x<=W+40;x+=40){
      let wx=x+camera*(.12+layer*.12);
      let y=ground-130-layer*38
        +Math.sin(wx*.008)*38
        +Math.sin(wx*.021)*17;

      ctx.lineTo(x,y);
    }

    ctx.lineTo(W,ground);
    ctx.closePath();

    ctx.fillStyle=[
      "#263b51",
      "#1d3747",
      "#172f39"
    ][layer];

    ctx.fill();
  }
}

function drawTree(x,y,size=1) {
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(size,size);

  pixel(-6,-54,12,55,"#49372f");

  for(let i=0;i<4;i++){
    ctx.fillStyle=[
      "#183e3d",
      "#205047",
      "#28604d",
      "#347057"
    ][i];

    ctx.beginPath();
    ctx.moveTo(0,-130+i*24);
    ctx.lineTo(-42,-45+i*20);
    ctx.lineTo(42,-45+i*20);
    ctx.closePath();
    ctx.fill();
  }

  // Điểm sáng trên lá
  pixel(-19,-90,7,4,"#4a8060");
  pixel(12,-67,6,4,"#477c5b");

  ctx.restore();
}

function drawForest() {
  for(let i=-2;i<Math.ceil(W/100)+3;i++){
    let x=i*100-(camera*.35%100);
    drawTree(x,ground,0.75+(i%3)*.13);
  }

  // Cây gần tiền cảnh
  for(let i=-1;i<Math.ceil(W/180)+2;i++){
    let x=i*180-(camera*.75%180);
    ctx.globalAlpha=.48;
    drawTree(x,ground+10,1.25);
    ctx.globalAlpha=1;
  }
}

function drawGround() {
  const g=ctx.createLinearGradient(0,ground,0,H);
  g.addColorStop(0,"#426c50");
  g.addColorStop(.1,"#284b3e");
  g.addColorStop(1,"#101d27");

  ctx.fillStyle=g;
  ctx.fillRect(0,ground,W,H-ground);

  pixel(0,ground,W,5,"#729b68");

  // Cỏ và đá
  for(let i=0;i<85;i++){
    let x=(i*97-camera*.9)%W;
    if(x<0)x+=W;

    pixel(x,ground+12+(i*31%55),3,3,
      i%2?"#6b8a58":"#496c4d");
  }

  for(let i=0;i<22;i++){
    let x=(i*211-camera*.8)%W;
    if(x<0)x+=W;

    pixel(x,ground+45+(i*17%40),8,4,"#263a37");
  }
}

function drawSwordCharacter() {
  let x=hero.x-camera;
  let y=hero.y;

  ctx.save();
  ctx.translate(x,y);
  ctx.scale(hero.direction,1);

  // Bóng
  ctx.fillStyle="#07111a88";
  ctx.beginPath();
  ctx.ellipse(0,hero.height+2,22,6,0,0,Math.PI*2);
  ctx.fill();

  // Áo choàng
  pixel(-14,19,28,28,"#304e6b");
  pixel(-18,27,7,20,"#243d57");
  pixel(-15,44,31,5,"#182d43");

  // Chân
  pixel(-12,44,10,13,"#273348");
  pixel(4,44,10,13,"#273348");

  // Giày
  pixel(-15,55,14,5,"#a77e60");
  pixel(2,55,14,5,"#a77e60");

  // Thân và cổ
  pixel(-10,12,20,11,"#c89b75");
  pixel(-12,18,24,24,"#426887");

  // Đầu
  pixel(-10,1,20,17,"#d9ae88");

  // Tóc
  pixel(-12,-2,24,7,"#202738");
  pixel(-11,3,5,7,"#202738");

  // Mắt
  pixel(5,7,3,3,"#182332");

  // Khăn đỏ
  pixel(-13,15,22,5,"#a9474b");
  pixel(-24,18,14,6,"#bd5750");

  // Tay
  pixel(10,22,8,13,"#d6a57e");

  // Thanh kiếm
  ctx.strokeStyle="#dffbff";
  ctx.lineWidth=4;
  ctx.lineCap="square";
  ctx.beginPath();
  ctx.moveTo(17,28);
  ctx.lineTo(36,0);
  ctx.stroke();

  // Lưỡi kiếm sáng
  ctx.strokeStyle="#9ce7ee";
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(19,25);
  ctx.lineTo(36,0);
  ctx.stroke();

  // Chuôi kiếm
  ctx.strokeStyle="#e5c38a";
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(10,30);
  ctx.lineTo(24,37);
  ctx.stroke();

  // Ánh sáng nhân vật
  const glow=ctx.createRadialGradient(0,28,3,0,28,55);
  glow.addColorStop(0,"#a5dfff12");
  glow.addColorStop(1,"#a5dfff00");

  ctx.fillStyle=glow;
  ctx.fillRect(-55,-20,110,110);

  ctx.restore();
}

function drawSlash() {
  if(hero.attacking<=0)return;

  let x=hero.x-camera;
  let y=hero.y+28;

  ctx.save();
  ctx.translate(x,y);
  ctx.scale(hero.direction,1);

  ctx.globalAlpha=hero.attacking*4;
  ctx.strokeStyle="#d9ffff";
  ctx.lineWidth=7;

  ctx.beginPath();
  ctx.arc(5,0,48,-1.2,.7);
  ctx.stroke();

  ctx.strokeStyle="#8ce5f1";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(5,0,53,-1.1,.6);
  ctx.stroke();

  ctx.restore();
  ctx.globalAlpha=1;
}

function drawParticles() {
  for(let p of particles){
    ctx.globalAlpha=Math.max(0,p.life);
    pixel(p.x-camera,p.y,p.size,p.size,p.color);
  }
  ctx.globalAlpha=1;
}

function createParticles(x,y,color,count=8) {
  for(let i=0;i<count;i++){
    particles.push({
      x:x,
      y:y,
      vx:(Math.random()-.5)*150,
      vy:-Math.random()*150,
      size:2+Math.random()*4,
      life:.5,
      color:color
    });
  }
}

function updateVisual(dt) {
  time+=dt;

  hero.frame+=dt*9;

  hero.moving=Math.abs(hero.vx)>15;

  for(let p of particles){
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vy+=350*dt;
    p.life-=dt;
  }

  for(let i=particles.length-1;i>=0;i--){
    if(particles[i].life<=0)particles.splice(i,1);
  }

  camera=Math.max(0,Math.min(
    worldWidth-W,
    hero.x-W*.42
  ));
}

function renderWorld() {
  drawSky();
  drawMountains();
  drawForest();
  drawGround();
  drawSlash();
  drawSwordCharacter();
  drawParticles();
}

// Phần 3 sẽ kết nối hệ thống chiến đấu,
// quái vật, NPC, Boss và vòng lặp game.
</script>

<script>
// PHẦN 3: GAMEPLAY VÀ KHỞI CHẠY

const enemies = [];
const npcs = [
  {x:650,name:"Lữ khách"},
  {x:2100,name:"Người gác cổng"}
];

for(let i=0;i<12;i++){
  enemies.push({
    x:400+i*260,
    hp:40,
    maxHp:40,
    alive:true,
    hit:0,
    phase:Math.random()*6
  });
}

const boss={
  x:3400,
  hp:300,
  maxHp:300,
  alive:true,
  rage:0,
  timer:0
};

let defeated=0;
let gold=12;
let xp=25;
let keys={};
let joystick=0;
let lastTime=0;

const healthUI=document.getElementById("health");
const xpUI=document.getElementById("experience");
const infoUI=document.getElementById("info");
const missionUI=document.getElementById("mission");

function sound(freq=240,duration=.08){
  try{
    const audio=new AudioContext();
    const osc=audio.createOscillator();
    const gain=audio.createGain();

    osc.frequency.value=freq;
    gain.gain.setValueAtTime(.05,audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      .001,audio.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime+duration);
  }catch(e){}
}

function attack(){
  if(!gameStarted || hero.attacking>0)return;

  hero.attacking=.25;
  sound(190,.09);

  for(let e of enemies){
    if(!e.alive)continue;

    let dx=e.x-hero.x;

    if(Math.abs(dx)<90 && Math.sign(dx||1)===hero.direction){
      e.hp-=20;
      e.hit=.2;

      createParticles(e.x,ground-20,"#9cf4c4",8);

      if(e.hp<=0){
        e.alive=false;
        defeated++;
        xp+=18;
        gold+=3;
        sound(420,.12);
      }
    }
  }

  if(boss.alive &&
    Math.abs(boss.x-hero.x)<115 &&
    Math.sign(boss.x-hero.x||1)===hero.direction){

    boss.hp-=20;
    createParticles(boss.x,ground-45,"#ffd37c",12);

    if(boss.hp<=0){
      boss.alive=false;
      sound(520,.4);
      missionUI.innerHTML="<b>CHIẾN THẮNG!</b><br>Thủ lĩnh rừng đã bị đánh bại.";
    }
  }
}

function jump(){
  if(hero.onGround && gameStarted){
    hero.vy=-510;
    hero.onGround=false;
    sound(320,.06);
  }
}

function dash(){
  if(!gameStarted)return;
  hero.vx=hero.direction*570;
  createParticles(hero.x,hero.y+40,"#a8efff",8);
  sound(400,.07);
}

function strongAttack(){
  if(!gameStarted)return;

  hero.vy=-180;
  hero.attacking=.35;
  sound(110,.15);

  for(let e of enemies){
    if(e.alive && Math.abs(e.x-hero.x)<125){
      e.hp-=35;
      if(e.hp<=0){
        e.alive=false;
        defeated++;
        xp+=18;
        gold+=3;
      }
      createParticles(e.x,ground-20,"#ffd47a",12);
    }
  }

  if(boss.alive && Math.abs(boss.x-hero.x)<145){
    boss.hp-=35;
    createParticles(boss.x,ground-40,"#ffd47a",15);
  }
}

function drawEnemy(e){
  if(!e.alive)return;

  let x=e.x-camera;
  let y=ground-30;

  ctx.save();
  ctx.translate(x,y);

  ctx.fillStyle="#07121c88";
  ctx.beginPath();
  ctx.ellipse(0,34,23,6,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle=e.hit>0?"#effff5":"#65d7a1";
  ctx.beginPath();
  ctx.moveTo(-21,28);
  ctx.quadraticCurveTo(-24,2,-8,0);
  ctx.quadraticCurveTo(18,-8,22,28);
  ctx.closePath();
  ctx.fill();

  pixel(-9,13,4,4,"#183b40");
  pixel(7,13,4,4,"#183b40");

  ctx.fillStyle="#26313b";
  ctx.fillRect(-19,-10,38,4);

  ctx.fillStyle="#f07174";
  ctx.fillRect(-19,-10,38*Math.max(0,e.hp/e.maxHp),4);

  ctx.restore();
}

function drawNPC(n){
  let x=n.x-camera;

  if(x<-50||x>W+50)return;

  ctx.save();
  ctx.translate(x,ground);

  pixel(-10,-43,20,28,"#b58c6b");
  pixel(-9,-61,18,18,"#d6ae8c");
  pixel(-11,-66,22,8,"#334257");
  pixel(-5,-55,3,3,"#202c36");

  ctx.fillStyle="#fff0c9";
  ctx.font="11px Arial";
  ctx.textAlign="center";
  ctx.fillText(n.name,0,-74);

  ctx.restore();
}

function drawBoss(){
  if(!boss.alive)return;

  let x=boss.x-camera;
  let y=ground-100;

  ctx.save();
  ctx.translate(x,y);

  ctx.fillStyle="#07121c88";
  ctx.beginPath();
  ctx.ellipse(0,103,48,9,0,0,Math.PI*2);
  ctx.fill();

  let angry=boss.hp<=boss.maxHp*.3;

  ctx.fillStyle=angry?"#a33f48":"#596d86";

  ctx.beginPath();
  ctx.moveTo(-42,85);
  ctx.lineTo(-36,26);
  ctx.lineTo(-22,8);
  ctx.lineTo(-9,25);
  ctx.lineTo(10,25);
  ctx.lineTo(24,5);
  ctx.lineTo(40,27);
  ctx.lineTo(45,85);
  ctx.closePath();
  ctx.fill();

  pixel(-23,37,12,6,"#ffdd9b");
  pixel(11,37,12,6,"#ffdd9b");

  ctx.fillStyle="#222d3b";
  ctx.fillRect(-40,-12,80,6);

  ctx.fillStyle="#e15c5c";
  ctx.fillRect(-40,-12,80*Math.max(0,boss.hp/boss.maxHp),6);

  ctx.restore();

  if(angry && boss.rage===0){
    boss.rage=60;
    boss.timer=60;
    sound(90,.5);
  }

  if(boss.rage>0){
    boss.rage=Math.max(0,boss.rage-.016);
  }
}

function updateEnemies(dt){
  for(let e of enemies){
    if(!e.alive)continue;

    e.hit=Math.max(0,e.hit-dt);

    let dx=hero.x-e.x;

    if(Math.abs(dx)<260){
      e.x+=Math.sign(dx)*65*dt;

      if(Math.abs(dx)<38){
        hero.vx*=.85;
      }
    }
  }

  if(boss.alive){
    let dx=hero.x-boss.x;
    let speed=boss.hp<=boss.maxHp*.3?110:65;

    if(Math.abs(dx)<420){
      boss.x+=Math.sign(dx)*speed*dt;
    }
  }
}

function updateGame(dt){
  if(!gameStarted)return;

  let move=0;

  if(keys.a||keys.arrowleft)move--;
  if(keys.d||keys.arrowright)move++;

  if(Math.abs(joystick)>.15)move=joystick;

  if(move){
    hero.direction=Math.sign(move);
    hero.vx=move*hero.speed;
  }else{
    hero.vx*=Math.pow(.001,dt);
  }

  hero.x+=hero.vx*dt;

  hero.vy+=1250*dt;
  hero.y+=hero.vy*dt;

  if(hero.y+hero.height>=ground){
    hero.y=ground-hero.height;
    hero.vy=0;
    hero.onGround=true;
  }else{
    hero.onGround=false;
  }

  hero.x=Math.max(30,Math.min(worldWidth-50,hero.x));

  hero.attacking=Math.max(0,hero.attacking-dt);

  updateEnemies(dt);
  updateVisual(dt);

  for(let e of enemies){
    if(e.alive && Math.abs(e.x-hero.x)<35){
      // Chạm quái tạo hiệu ứng va chạm.
    }
  }

  healthUI.style.width="100%";
  xpUI.style.width=(xp%100)+"%";

  infoUI.textContent=
    "HP 100/100 · LV "+(1+Math.floor(xp/100))+
    " · GOLD "+gold;

  missionUI.innerHTML=
    "<b>NHIỆM VỤ</b><br>"+
    "Đánh bại Slime<br>"+
    "Slime: "+defeated+" / 3";
}

function renderGame(){
  renderWorld();

  for(let e of enemies)drawEnemy(e);
  for(let n of npcs)drawNPC(n);

  drawBoss();
}

function loop(t){
  let dt=Math.min(.033,(t-lastTime)/1000||0);
  lastTime=t;

  updateGame(dt);
  renderGame();

  requestAnimationFrame(loop);
}

document.getElementById("start").onclick=()=>{
  gameStarted=true;
  document.getElementById("startScreen").style.display="none";
  sound(440,.2);
};

document.addEventListener("keydown",e=>{
  let k=e.key.toLowerCase();
  keys[k]=true;

  if(e.repeat)return;

  if(k==="j")attack();
  if(k===" ")jump();
  if(k==="k")dash();
  if(k==="l")strongAttack();
});

document.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});

function bindButton(id,fn){
  document.getElementById(id).addEventListener("pointerdown",e=>{
    e.preventDefault();
    fn();
  });
}

bindButton("attack",attack);
bindButton("jump",jump);
bindButton("dash",dash);
bindButton("skill",strongAttack);

// Joystick cảm ứng
const joystickElement=document.getElementById("joystick");
const stickElement=document.getElementById("stick");
let joystickPointer=null;

joystickElement.addEventListener("pointerdown",e=>{
  joystickPointer=e.pointerId;
  joystickElement.setPointerCapture(e.pointerId);
  moveJoystick(e);
});

joystickElement.addEventListener("pointermove",e=>{
  if(e.pointerId===joystickPointer)moveJoystick(e);
});

function moveJoystick(e){
  const r=joystickElement.getBoundingClientRect();

  let dx=e.clientX-r.left-r.width/2;
  let dy=e.clientY-r.top-r.height/2;

  joystick=Math.max(-1,Math.min(1,dx/38));

  let length=Math.hypot(dx,dy);
  if(length>34){
    dx=dx/length*34;
    dy=dy/length*34;
  }

  stickElement.style.transform=
    `translate(${dx}px,${dy}px)`;
}

function releaseJoystick(e){
  if(e.pointerId!==joystickPointer)return;

  joystickPointer=null;
  joystick=0;
  stickElement.style.transform="translate(0,0)";
}

joystickElement.addEventListener("pointerup",releaseJoystick);
joystickElement.addEventListener("pointercancel",releaseJoystick);

requestAnimationFrame(loop);
</script>
